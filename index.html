/** Depolama erişilemezse (gizli mod vb.) bellek içi yedek kullanılır. */
function safeArea(name) {
  try {
    const area = window[name];
    const k = '__ishan_test__';
    area.setItem(k, '1'); area.removeItem(k);
    return area;
  } catch (e) {
    const mem = new Map();
    return { getItem: k => (mem.has(k) ? mem.get(k) : null), setItem: (k, v) => mem.set(k, String(v)), removeItem: k => mem.delete(k) };
  }
}
const LS = safeArea('localStorage');
const SS = safeArea('sessionStorage');

const Store = {
  /** Kayıt {v, d} biçimindedir; sürüm uyuşmaz veya veri bozuksa undefined döner. */
  read(area, key) {
    try {
      const raw = area.getItem(key);
      if (raw == null) return undefined;
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object' || obj.v !== CONFIG.STORAGE_VERSION) return undefined;
      return obj.d;
    } catch (e) {
      console.warn('[Ishan] Bozuk kayıt yok sayıldı:', key);
      return undefined;
    }
  },
  write(area, key, data) {
    try { area.setItem(key, JSON.stringify({ v: CONFIG.STORAGE_VERSION, d: data })); return true; }
    catch (e) { console.warn('[Ishan] Kayıt yazılamadı:', key, e && e.name); return false; }
  },
  remove(area, key) { try { area.removeItem(key); } catch (e) { /* yok say */ } },
};

const isObj = (x) => !!x && typeof x === 'object' && !Array.isArray(x);
const isInt = (x, min, max) => Number.isInteger(x) && x >= min && x <= max;
const isPid = (x) => typeof x === 'string' && /^p[a-z0-9]{8,24}$/.test(x);
const isCatId = (x) => typeof x === 'string' && /^[a-z][a-z0-9-]{1,15}$/.test(x);
const randId = (len) => { let s = ''; const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; const buf = new Uint32Array(len); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(buf) : buf.forEach((_, i) => { buf[i] = Math.random() * 1e9; }); for (let i = 0; i < len; i++) s += a[buf[i] % a.length]; return s; };
const clampInt = (x, min, max, def) => (Number.isFinite(x) ? Math.max(min, Math.min(max, Math.round(x))) : def);

/** Profil: isim + renk. */
const Profile = {
  get() {
    const d = Store.read(LS, 'ishan:profile');
    const name = isObj(d) ? cleanText(d.name, CONFIG.NAME_MAX) : '';
    const color = isObj(d) && isInt(d.color, 0, PLAYER_COLORS.length - 1) ? d.color : 0;
    return { name, color };
  },
  set(p) { Store.write(LS, 'ishan:profile', { name: cleanText(p.name, CONFIG.NAME_MAX), color: clampInt(p.color, 0, PLAYER_COLORS.length - 1, 0) }); },
};

/** Lobi ayarları: varsayılan + doğrulama. */
function defaultSettings() {
  return {
    rounds: 5, duration: 90,
    catIds: CATEGORY_DEFS.filter(c => c.def).map(c => c.id),
    custom: [],
    letters: DEFAULT_LETTERS.slice(),
  };
}
/** Ayarları doğrular ve kategorileri çözümler (cats alanı her zaman yeniden üretilir). */
function sanitizeSettings(s) {
  const out = defaultSettings();
  if (isObj(s)) {
    if (CONFIG.ROUND_OPTIONS.includes(s.rounds)) out.rounds = s.rounds;
    if (CONFIG.DURATION_OPTIONS.includes(s.duration)) out.duration = s.duration;
    if (Array.isArray(s.custom)) {
      const seen = new Set();
      out.custom = s.custom.slice(0, CONFIG.CUSTOM_CAT_LIMIT).map(c => {
        if (!isObj(c) || !isCatId(c.id) || !c.id.startsWith('c-') || seen.has(c.id)) return null;
        const name = cleanText(c.name, CONFIG.CUSTOM_CAT_MAX);
        if (!name) return null;
        seen.add(c.id);
        return { id: c.id, name };
      }).filter(Boolean);
    }
    if (Array.isArray(s.catIds)) {
      const valid = new Set([...CATEGORY_DEFS.map(c => c.id), ...out.custom.map(c => c.id)]);
      const ids = [...new Set(s.catIds.filter(id => typeof id === 'string' && valid.has(id)))];
      if (ids.length >= CONFIG.MIN_CATS && ids.length <= CONFIG.MAX_CATS) out.catIds = ids;
    }
    if (Array.isArray(s.letters)) {
      const pool = Engine.letterPool(s.letters);
      if (pool.length >= 1) out.letters = pool;
    }
  }
  out.cats = resolveCats(out);
  return out;
}
/** Kategori kimliklerini {id,name,kind} nesnelerine çevirir; sıra: hazırlar, sonra özel. */
function resolveCats(s) {
  const all = [...CATEGORY_DEFS.map(c => ({ id: c.id, name: c.name, kind: c.kind })), ...s.custom.map(c => ({ id: c.id, name: c.name, kind: null }))];
  const set = new Set(s.catIds);
  return all.filter(c => set.has(c.id));
}
const SavedSettings = {
  get() { return sanitizeSettings(Store.read(LS, 'ishan:settings')); },
  set(s) { Store.write(LS, 'ishan:settings', { rounds: s.rounds, duration: s.duration, catIds: s.catIds, custom: s.custom, letters: s.letters }); },
};

/** Maç geçmişi (istatistikler bundan hesaplanır). */
const History = {
  list() {
    const d = Store.read(LS, 'ishan:history');
    if (!Array.isArray(d)) return [];
    return d.filter(e => isObj(e) && typeof e.id === 'string' && Number.isFinite(e.ts) && Array.isArray(e.players)).map(e => ({
      id: String(e.id).slice(0, 32), ts: e.ts, code: typeof e.code === 'string' ? e.code.slice(0, 5) : '',
      rounds: clampInt(e.rounds, 0, 10, 0),
      players: e.players.slice(0, CONFIG.MAX_PLAYERS).filter(isObj).map(p => ({
        name: cleanText(p.name, CONFIG.NAME_MAX) || 'Oyuncu', color: clampInt(p.color, 0, 7, 0),
        total: clampInt(p.total, 0, 100000, 0), rank: clampInt(p.rank, 1, 8, 1), me: p.me === true,
      })),
      myRank: clampInt(e.myRank, 1, 8, 1), myTotal: clampInt(e.myTotal, 0, 100000, 0), won: e.won === true,
      cats: isObj(e.cats) ? Object.fromEntries(Object.entries(e.cats).slice(0, 20).filter(([k, v]) => isObj(v)).map(([k, v]) => [cleanText(k, CONFIG.CUSTOM_CAT_MAX), { pts: clampInt(v.pts, 0, 100000, 0), n: clampInt(v.n, 0, 100, 0) }])) : {},
    }));
  },
  add(entry) {
    const list = History.list().filter(e => e.id !== entry.id);
    list.unshift(entry);
    Store.write(LS, 'ishan:history', list.slice(0, CONFIG.HISTORY_LIMIT));
  },
  has(id) { return History.list().some(e => e.id === id); },
  clear() { Store.remove(LS, 'ishan:history'); },
};

/** Sekmeye özel oturum bilgileri (sessionStorage). */
const Tab = {
  /** Her sekmenin kalıcı oyuncu kimliği. */
  pid() {
    let pid = Store.read(SS, 'ishan:pid');
    if (!isPid(pid)) { pid = 'p' + randId(14); Store.write(SS, 'ishan:pid', pid); }
    return pid;
  },
  getSession() {
    const d = Store.read(SS, 'ishan:session');
    return isObj(d) && Engine.isValidCode(d.code) && (d.role === 'host' || d.role === 'guest') ? { code: d.code, role: d.role } : null;
  },
  setSession(code, role) { Store.write(SS, 'ishan:session', { code, role }); },
  clearSession() { Store.remove(SS, 'ishan:session'); Store.remove(SS, 'ishan:draft'); },
  getDraft(key) {
    const d = Store.read(SS, 'ishan:draft');
    if (!isObj(d) || d.key !== key || !isObj(d.a)) return null;
    const a = {};
    for (const [k, v] of Object.entries(d.a).slice(0, CONFIG.MAX_CATS)) if (isCatId(k) && typeof v === 'string') a[k] = v.slice(0, CONFIG.ANSWER_MAX);
    return a;
  },
  setDraft(key, a) { Store.write(SS, 'ishan:draft', { key, a }); },
};

/* =========================================================================
 * 7. ARAYÜZ ÇEKİRDEĞİ: güvenli şablon, DOM eşleme (morph), toast, modal
 * ========================================================================= */
const RAW = Symbol('raw');
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' };
const esc = (s) => String(s).replace(/[&<>"'`]/g, c => ESC_MAP[c]);
const raw = (s) => ({ [RAW]: true, s: String(s) });
function fmt(v) {
  if (v == null || v === false || v === true) return '';
  if (Array.isArray(v)) return v.map(fmt).join('');
  if (typeof v === 'object' && v[RAW]) return v.s;
  return esc(v);
}
/** Etiketli şablon: tüm değerler otomatik escape edilir; yalnızca raw() ile işaretlenenler olduğu gibi kalır. */
function html(strings, ...vals) {
  let out = '';
  for (let i = 0; i < strings.length; i++) { out += strings[i]; if (i < vals.length) out += fmt(vals[i]); }
  return raw(out);
}
const attrIf = (cond, name, value = '') => (cond ? raw(value === '' ? ` ${name}` : ` ${name}="${esc(value)}"`) : '');
const colorStyle = (idx) => raw(`style="--pc:${PLAYER_COLORS[clampInt(idx, 0, 7, 0)].hex}"`);

/**
 * Küçük DOM eşleyici: yeni şablonu mevcut DOM ile karşılaştırır ve yalnızca
 * değişen kısımları günceller. Böylece yeniden çizimde yazılan cevaplar,
 * imleç konumu, odak ve kaydırma kaybolmaz. data-key ile anahtarlı eşleme yapılır.
 */
const Morph = {
  apply(target, htmlString) {
    const tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    Morph.children(target, tpl.content);
  },
  same(a, b) {
    if (a.nodeType !== b.nodeType) return false;
    if (a.nodeType !== 1) return true;
    return a.tagName === b.tagName && (a.getAttribute('data-key') || '') === (b.getAttribute('data-key') || '');
  },
  node(from, to) {
    if (!Morph.same(from, to)) { from.replaceWith(to); return; }
    if (from.nodeType !== 1) { if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
    Morph.attrs(from, to);
    if (from.hasAttribute('data-morph-skip')) return;
    if (from.tagName === 'TEXTAREA') return;
    Morph.children(from, to);
  },
  attrs(from, to) {
    for (const { name } of Array.from(from.attributes)) if (!to.hasAttribute(name)) from.removeAttribute(name);
    for (const { name, value } of Array.from(to.attributes)) if (from.getAttribute(name) !== value) from.setAttribute(name, value);
    if (from.tagName === 'INPUT') {
      const type = (from.type || '').toLowerCase();
      if (type === 'checkbox' || type === 'radio') from.checked = to.hasAttribute('checked');
      else if (to.hasAttribute('data-sync') && document.activeElement !== from) from.value = to.getAttribute('value') || '';
      from.disabled = to.hasAttribute('disabled');
    }
  },
  children(from, to) {
    const toKids = Array.from(to.childNodes);
    let cur = from.firstChild;
    for (const t of toKids) {
      const key = t.nodeType === 1 ? t.getAttribute('data-key') : null;
      let match = null;
      if (key) {
        for (let n = cur; n; n = n.nextSibling) if (n.nodeType === 1 && n.getAttribute('data-key') === key) { match = n; break; }
      } else if (cur && Morph.same(cur, t)) match = cur;
      if (match) {
        if (match !== cur) from.insertBefore(match, cur);
        cur = match.nextSibling;
        Morph.node(match, t);
      } else {
        from.insertBefore(t, cur);
      }
    }
    while (cur) { const nx = cur.nextSibling; from.removeChild(cur); cur = nx; }
  },
};

const Toast = {
  show(message, type = 'info', ms = 3200) {
    try {
      const root = document.getElementById('toasts');
      if (!root) return;
      while (root.children.length >= 3) root.firstElementChild.remove();
      const el = document.createElement('div');
      el.className = 'toast' + (type === 'ok' ? ' ok' : type === 'err' ? ' err' : '');
      el.textContent = String(message);
      root.appendChild(el);
      setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, ms);
    } catch (e) { console.warn(e); }
  },
};

/** Erişilebilir onay penceresi: odak hapsi, Esc ile kapanma, odak iadesi. */
const Modal = {
  open: null,
  confirm({ title, body, confirmText = 'Onayla', cancelText = 'Vazgeç', danger = false }) {
    if (Modal.open) Modal.open.finish(false);
    return new Promise(resolve => {
      const root = document.getElementById('modal-root');
      const prevFocus = document.activeElement;
      const back = document.createElement('div');
      back.className = 'modal-back';
      back.innerHTML = html`<div class="elite modal" role="dialog" aria-modal="true" aria-labelledby="m-title" aria-describedby="m-body">
          <h2 id="m-title">${title}</h2><p id="m-body">${body}</p>
          <div class="btn-row"><button type="button" class="btn" data-m="no">${cancelText}</button>
          <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-m="yes">${confirmText}</button></div></div>`.s;
      const finish = (val) => {
        if (!Modal.open || Modal.open.back !== back) return;
        Modal.open = null;
        document.removeEventListener('keydown', onKey, true);
        back.remove();
        try { if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus(); } catch (e) { /* yok say */ }
        resolve(val);
      };
      const onKey = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        else if (e.key === 'Tab') {
          const f = back.querySelectorAll('button');
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      };
      back.addEventListener('click', (e) => {
        if (e.target === back) finish(false);
        const b = e.target.closest('[data-m]');
        if (b) finish(b.getAttribute('data-m') === 'yes');
      });
      document.addEventListener('keydown', onKey, true);
      root.appendChild(back);
      Modal.open = { back, finish };
      back.querySelector(danger ? '[data-m="no"]' : '[data-m="yes"]').focus();
    });
  },
};

/* =========================================================================
 * 8. AĞ KATMANI (PeerJS / WebRTC)
 * ========================================================================= */
/** PeerJS yalnızca online ekrana girildiğinde, sabit sürümle yüklenir. */
const PeerLoader = {
  promise: null,
  sources: [
    { url: `https://cdn.jsdelivr.net/npm/peerjs@${CONFIG.PEERJS_VERSION}/dist/peerjs.min.js`, sri: 'sha384-x0YgkOr/3UOZP2CRDxGW9e0Q+2Qjyr3uJrm4xU32Y7ZCNAo7Cc7bjhrZMi/dwczu' },
    { url: `https://unpkg.com/peerjs@${CONFIG.PEERJS_VERSION}/dist/peerjs.min.js`, sri: 'sha384-x0YgkOr/3UOZP2CRDxGW9e0Q+2Qjyr3uJrm4xU32Y7ZCNAo7Cc7bjhrZMi/dwczu' },
  ],
  get() { return typeof window.Peer === 'function' ? window.Peer : null; },
  script(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src.url;
      s.async = true;
      s.crossOrigin = 'anonymous';
      if (src.sri && !src.sri.startsWith('__')) s.integrity = src.sri;
      const t = setTimeout(() => { s.remove(); reject(new Error('zaman aşımı')); }, 15000);
      s.onload = () => { clearTimeout(t); resolve(); };
      s.onerror = () => { clearTimeout(t); s.remove(); reject(new Error('yüklenemedi')); };
      document.head.appendChild(s);
    });
  },
  load() {
    const ready = PeerLoader.get();
    if (ready) return Promise.resolve(ready);
    if (PeerLoader.promise) return PeerLoader.promise;
    PeerLoader.promise = PeerLoader.sources.reduce(
      (p, src) => p.catch(() => PeerLoader.script(src).then(() => { if (!PeerLoader.get()) throw new Error('Peer bulunamadı'); })),
      Promise.reject(new Error('başlangıç'))
    ).then(() => PeerLoader.get()).catch(err => { PeerLoader.promise = null; const e = new Error('cdn'); e.type = 'cdn'; e.cause = err; throw e; });
    return PeerLoader.promise;
  },
};

/** ?peer=host:port[/yol] parametresiyle özel PeerServer; yoksa PeerJS ortak sunucusu. */
function peerOptions() {
  const opts = { debug: 0 };
  try {
    const q = new URLSearchParams(location.search);
    const val = q.get('peer');
    if (val) {
      const m = /^([a-zA-Z0-9.-]+|\[[0-9a-fA-F:]+\]):(\d{1,5})(\/[a-zA-Z0-9._~\/-]*)?$/.exec(val.trim());
      if (m && +m[2] > 0 && +m[2] < 65536) {
        const host = m[1].replace(/^\[|\]$/g, '');
        const port = +m[2];
        const local = /^(localhost|127\.|10\.|192\.168\.|::1$)/.test(host);
        opts.host = host;
        opts.port = port;
        opts.path = m[3] || '/';
        const sec = q.get('peersecure');
        opts.secure = sec === '1' ? true : sec === '0' ? false : (port === 443 || (location.protocol === 'https:' && !local));
        const key = q.get('peerkey');
        if (key && /^[a-zA-Z0-9_-]{1,40}$/.test(key)) opts.key = key;
      } else {
        console.warn('[Ishan] Geçersiz ?peer parametresi, ortak sunucu kullanılıyor.');
      }
    }
  } catch (e) { console.warn(e); }
  return opts;
}
const peerIdFor = (code) => CONFIG.PEER_PREFIX + code.toLowerCase();

/** PeerServer'a kayıt olur; açıldığında Peer nesnesini döndürür. */
function openPeer(PeerCtor, id) {
  return new Promise((resolve, reject) => {
    let peer;
    try { peer = id ? new PeerCtor(id, peerOptions()) : new PeerCtor(peerOptions()); }
    catch (e) { reject({ type: 'browser-incompatible' }); return; }
    let settled = false;
    const done = (fn, val) => { if (settled) return; settled = true; clearTimeout(timer); peer.off('open', onOpen); peer.off('error', onErr); fn(val); };
    const onOpen = () => done(resolve, peer);
    const onErr = (err) => { try { peer.destroy(); } catch (e) { /* yok say */ } done(reject, { type: (err && err.type) || 'unknown' }); };
    const timer = setTimeout(() => { try { peer.destroy(); } catch (e) { /* yok say */ } done(reject, { type: 'timeout' }); }, CONFIG.CONNECT_TIMEOUT_MS);
    peer.on('open', onOpen);
    peer.on('error', onErr);
  });
}

/**
 * Veri kanalını sarmalar: JSON ayrıştırma, boyut sınırı, kalp atışı (ping) ve
 * sessizlik zaman aşımı. Tüm mesajlar metin olarak gönderilir.
 */
function wrapConn(conn, handlers) {
  const w = {
    conn, pid: null, last: Time.now(), closed: false,
    send(obj) {
      if (w.closed || !conn.open) return false;
      try { conn.send(JSON.stringify(obj)); return true; }
      catch (e) { console.warn('[Ishan] Gönderilemedi', e && e.message); return false; }
    },
    close(reason = 'local', silent = false) {
      if (w.closed) return;
      w.closed = true;
      clearInterval(hb);
      try { conn.close(); } catch (e) { /* yok say */ }
      if (!silent && handlers.onClose) handlers.onClose(reason);
    },
  };
  conn.on('data', (data) => {
    w.last = Time.now();
    if (typeof data !== 'string' || data.length > CONFIG.MAX_MSG_CHARS) return;
    let m;
    try { m = JSON.parse(data); } catch (e) { return; }
    if (!isObj(m) || typeof m.t !== 'string' || m.t.length > 16) return;
    if (m.t === 'ping') return;
    try { handlers.onMessage(m, w); } catch (e) { console.error('[Ishan] Mesaj işlenemedi', e); }
  });
  conn.on('close', () => w.close('remote'));
  conn.on('error', (e) => console.warn('[Ishan] Kanal hatası', e && e.type));
  const hb = setInterval(() => {
    if (Time.now() - w.last > CONFIG.PEER_SILENCE_MS) w.close('timeout');
    else w.send({ t: 'ping' });
  }, CONFIG.HEARTBEAT_MS);
  return w;
}

/* ---- Ağ mesajı doğrulama (misafir → ev sahibi) ---- */
function readAnswerMap(a) {
  if (!isObj(a)) return null;
  const out = {};
  const entries = Object.entries(a);
  if (entries.length > CONFIG.MAX_CATS) return null;
  for (const [k, v] of entries) {
    if (!isCatId(k) || typeof v !== 'string' || v.length > CONFIG.ANSWER_MAX * 3) return null;
    out[k] = cleanText(v, CONFIG.ANSWER_MAX);
  }
  return out;
}
function validateGuestMsg(m) {
  switch (m.t) {
    case 'hello': {
      if (!isPid(m.pid) || typeof m.name !== 'string' || m.name.length > 64 || !isInt(m.color, 0, 7)) return null;
      if (typeof m.ver !== 'string' || m.ver.length > 16 || typeof m.sig !== 'string' || m.sig.length > 32 || !isInt(m.proto, 0, 1000)) return null;
      const name = cleanText(m.name, CONFIG.NAME_MAX);
      if (!name) return null;
      return { t: 'hello', pid: m.pid, name, color: m.color, ver: m.ver, sig: m.sig, proto: m.proto };
    }
    case 'answers': case 'stop': {
      if (!isInt(m.round, 0, 99)) return null;
      const a = readAnswerMap(m.a);
      if (!a) return null;
      return { t: m.t, round: m.round, a, final: m.final === true };
    }
    case 'vote':
      if (!isInt(m.round, 0, 99) || !isCatId(m.cat) || !isPid(m.target) || typeof m.v !== 'boolean') return null;
      return { t: 'vote', round: m.round, cat: m.cat, target: m.target, v: m.v };
    case 'color':
      if (!isInt(m.color, 0, 7)) return null;
      return { t: 'color', color: m.color };
    case 'leave':
      return { t: 'leave' };
    default:
      return null;
  }
}

/* ---- Oda durumu doğrulama (ev sahibi → misafir) ---- */
const PHASES = ['lobby', 'reveal', 'playing', 'collect', 'review', 'final'];
function numOrNull(x, max) { return Number.isFinite(x) && x >= 0 ? Math.min(x, max) : null; }
function pidMap(obj, valFn, pids) {
  const out = {};
  if (!isObj(obj)) return out;
  for (const [k, v] of Object.entries(obj).slice(0, 16)) if (pids.has(k)) { const r = valFn(v); if (r !== undefined) out[k] = r; }
  return out;
}
const intVal = (max) => (v) => (isInt(v, 0, max) ? v : undefined);

/** Ev sahibinden gelen oda durumunu sadece beklenen alanlarla yeniden kurar. */
function sanitizeRoom(r) {
  if (!isObj(r)) return null;
  if (!Engine.isValidCode(r.code) || !PHASES.includes(r.phase) || !isPid(r.hostPid)) return null;
  if (!Array.isArray(r.players) || r.players.length > CONFIG.MAX_PLAYERS + 4) return null;
  const players = [];
  const seen = new Set();
  for (const p of r.players) {
    if (!isObj(p) || !isPid(p.pid) || seen.has(p.pid)) continue;
    seen.add(p.pid);
    players.push({ pid: p.pid, name: cleanText(p.name, CONFIG.NAME_MAX) || 'Oyuncu', color: clampInt(p.color, 0, 7, 0), host: p.pid === r.hostPid, conn: p.conn === true, left: p.left === true });
  }
  const pids = new Set(players.map(p => p.pid));
  const settings = sanitizeSettings(r.settings);
  const catIds = new Set(settings.cats.map(c => c.id));
  const letterOk = (l) => (typeof l === 'string' && PLAYABLE_LETTERS.includes(l) ? l : null);
  const t = isObj(r.timer) ? r.timer : {};
  const out = {
    code: r.code,
    matchId: typeof r.matchId === 'string' ? r.matchId.slice(0, 24) : '',
    phase: r.phase,
    hostPid: r.hostPid,
    settings,
    players,
    roundIdx: isInt(r.roundIdx, -1, 9) ? r.roundIdx : -1,
    letter: letterOk(r.letter),
    timer: {
      remaining: numOrNull(t.remaining, 3600000),
      stopRemaining: numOrNull(t.stopRemaining, 60000),
      reveal: numOrNull(t.reveal, 10000),
      stopBy: isPid(t.stopBy) && pids.has(t.stopBy) ? t.stopBy : null,
      forced: t.forced === true,
    },
    fill: pidMap(r.fill, intVal(CONFIG.MAX_CATS), pids),
    review: null,
    rounds: [],
    totals: pidMap(r.totals, intVal(100000), pids),
    stops: pidMap(r.stops, intVal(100), pids),
    uniques: pidMap(r.uniques, intVal(1000), pids),
    catPts: null,
  };
  if (Array.isArray(r.rounds)) {
    out.rounds = r.rounds.slice(0, 10).filter(isObj).map(x => ({
      letter: letterOk(x.letter) || '?',
      stopBy: isPid(x.stopBy) && pids.has(x.stopBy) ? x.stopBy : null,
      pts: pidMap(x.pts, intVal(1000), pids),
      uniques: pidMap(x.uniques, intVal(10), pids),
    }));
  }
  if (isObj(r.review) && isObj(r.review.rows)) {
    const rows = {};
    for (const c of settings.cats) {
      const src = r.review.rows[c.id];
      rows[c.id] = pidMap(src, (cell) => {
        if (!isObj(cell)) return undefined;
        return {
          text: cleanText(cell.text, CONFIG.ANSWER_MAX), empty: cell.empty === true, letterOk: cell.letterOk === true,
          verified: cell.verified === true, notInList: cell.notInList === true, votable: cell.votable === true,
          votes: Array.isArray(cell.votes) ? cell.votes.filter(v => pids.has(v)).slice(0, 8) : [],
          voters: clampInt(cell.voters, 0, 8, 0),
          override: cell.override === 'valid' || cell.override === 'invalid' ? cell.override : null,
          valid: cell.valid === true, dup: cell.dup === true, pts: clampInt(cell.pts, 0, 20, 0),
        };
      }, pids);
    }
    out.review = { rows, pts: pidMap(r.review.pts, intVal(1000), pids), uniques: pidMap(r.review.uniques, intVal(10), pids) };
  }
  if (isObj(r.catPts)) {
    out.catPts = pidMap(r.catPts, (m) => {
      if (!isObj(m)) return undefined;
      const o = {};
      for (const [k, v] of Object.entries(m).slice(0, 16)) if (catIds.has(k) && isInt(v, 0, 10000)) o[k] = v;
      return o;
    }, pids);
  }
  return out;
}

/* =========================================================================
 * 9. ODA YÖNETİMİ – EV SAHİBİ (maçın tek otoritesi)
 * ========================================================================= */
/**
 * Ev sahibi oturumu. Harfi seçer, zamanlayıcıyı yönetir, cevapları
 * yalnızca kendi tarayıcısında toplar, puanlar ve herkese durumu yayınlar.
 */
function createHostSession(code, profile, snapshot) {
  const S = {
    role: 'host', code, myPid: Tab.pid(), status: 'opening', statusInfo: null,
    room: null, peer: null, conns: new Map(), closed: false, serverLost: false,
  };
  let H;              // tam (özel) oda durumu
  let tickTimer = null, lastTickSent = 0, persistTimer = null, bcastTimer = null;

  /* ---------- Durum kurulumu ---------- */
  function freshMatch() {
    H.matchId = 'm' + randId(10);
    H.roundIdx = -1; H.letter = null; H.usedLetters = [];
    H.rounds = []; H.totals = {}; H.stops = {}; H.uniques = {}; H.catPts = {};
    resetRoundState();
  }
  function resetRoundState() {
    H.answers = {}; H.finals = []; H.votes = {}; H.overrides = {}; H.review = null;
    H.deadline = null; H.stopDeadline = null; H.revealDeadline = null; H.collectDeadline = null;
    H.stopBy = null; H.forced = false; H.roundPids = [];
  }
  if (snapshot) {
    H = snapshot;
    S.myPid = H.hostPid;
  } else {
    H = {
      code, hostPid: S.myPid, phase: 'lobby', settings: SavedSettings.get(),
      players: [{ pid: S.myPid, name: profile.name, color: profile.color, conn: true, left: false, discAt: null }],
    };
    freshMatch();
  }

  const player = (pid) => H.players.find(p => p.pid === pid);
  const activePlayers = () => H.players.filter(p => !p.left);
  const connectedPlayers = () => H.players.filter(p => !p.left && p.conn);
  const cats = () => H.settings.cats;

  /* ---------- Yayın ---------- */
  function publicState() {
    const now = Time.now();
    const fill = {};
    if (H.phase === 'playing' || H.phase === 'collect' || H.phase === 'reveal') {
      for (const p of H.players) fill[p.pid] = Engine.filledCount(cats(), H.answers[p.pid]);
    }
    let review = null;
    if (H.phase === 'review' && H.review) {
      const rows = {};
      for (const [catId, byPid] of Object.entries(H.review.rows)) {
        rows[catId] = {};
        for (const [pid, c] of Object.entries(byPid)) {
          rows[catId][pid] = { text: c.text, empty: c.empty, letterOk: c.letterOk, verified: c.verified, notInList: c.notInList, votable: c.votable, votes: c.votes, voters: c.voters, override: c.override, valid: c.valid, dup: c.dup, pts: c.pts };
        }
      }
      review = { rows, pts: H.review.pts, uniques: H.review.uniques };
    }
    return {
      code: H.code, matchId: H.matchId, phase: H.phase, hostPid: H.hostPid,
      settings: { rounds: H.settings.rounds, duration: H.settings.duration, catIds: H.settings.catIds, custom: H.settings.custom, letters: H.settings.letters },
      players: H.players.map(p => ({ pid: p.pid, name: p.name, color: p.color, conn: p.conn, left: p.left })),
      roundIdx: H.roundIdx,
      letter: H.phase === 'lobby' ? null : H.letter,
      timer: {
        // Bitiş zamanı değil kalan süre gönderilir: cihaz saati farkları önemsizleşir.
        remaining: H.deadline != null ? Math.max(0, Math.round(H.deadline - now)) : null,
        stopRemaining: H.stopDeadline != null ? Math.max(0, Math.round(H.stopDeadline - now)) : null,
        reveal: H.revealDeadline != null ? Math.max(0, Math.round(H.revealDeadline - now)) : null,
        stopBy: H.stopBy, forced: H.forced,
      },
      fill, review,
      rounds: H.rounds, totals: H.totals, stops: H.stops, uniques: H.uniques,
      catPts: H.phase === 'final' ? H.catPts : null,
    };
  }
  function broadcastNow() {
    clearTimeout(bcastTimer); bcastTimer = null;
    const st = publicState();
    const msg = { t: 'state', room: st };
    for (const w of S.conns.values()) w.send(msg);
    S.room = sanitizeRoom(st);
    App.onRoomState(S.room);
    persistSoon();
  }
  /** Değişiklikleri kısa süre içinde tek yayında birleştirir. */
  function changed(immediate = false) {
    if (immediate) { broadcastNow(); return; }
    if (!bcastTimer) bcastTimer = setTimeout(broadcastNow, 40);
  }
  function sendTick() {
    const st = publicState();
    const msg = { t: 'tick', ri: H.roundIdx, timer: st.timer };
    for (const w of S.conns.values()) w.send(msg);
    App.onTick(st.timer, H.roundIdx);
  }

  /* ---------- Kalıcılık (ev sahibi sayfayı yenilerse) ---------- */
  function snapshotNow() {
    if (S.closed) return;
    const now = Time.now();
    const rel = (d) => (d == null ? null : Math.max(0, d - now));
    const snap = Object.assign({}, H, {
      deadline: rel(H.deadline), stopDeadline: rel(H.stopDeadline),
      revealDeadline: rel(H.revealDeadline), collectDeadline: rel(H.collectDeadline),
    });
    Store.write(LS, 'ishan:hostroom', { savedAt: Date.now(), H: snap });
  }
  function persistSoon() { if (!persistTimer) persistTimer = setTimeout(() => { persistTimer = null; snapshotNow(); }, 400); }
  S.persistNow = snapshotNow;

  /* ---------- Tur akışı ---------- */
  function startRound(i) {
    const pool = Engine.letterPool(H.settings.letters);
    const letter = Engine.pickLetter(pool, H.usedLetters);
    if (!letter) { Toast.show('Harf havuzunda kullanılmamış harf kalmadı.', 'err'); return false; }
    resetRoundState();
    H.usedLetters.push(letter);
    H.roundIdx = i; H.letter = letter; H.phase = 'reveal';
    H.revealDeadline = Time.now() + CONFIG.REVEAL_MS;
    H.roundPids = activePlayers().map(p => p.pid);
    for (const pid of H.roundPids) H.answers[pid] = {};
    changed(true);
    return true;
  }
  function beginPlaying() {
    H.phase = 'playing';
    H.revealDeadline = null;
    H.deadline = H.settings.duration ? Time.now() + H.settings.duration * 1000 : null;
    changed(true);
  }
  function lock() {
    H.phase = 'collect';
    H.deadline = null; H.stopDeadline = null;
    H.collectDeadline = Time.now() + CONFIG.COLLECT_GRACE_MS;
    if (!H.finals.includes(S.myPid)) H.finals.push(S.myPid);
    changed(true);
  }
  function evaluate() {
    const active = H.roundPids.filter(pid => { const p = player(pid); return p && p.conn && !p.left; });
    H.review = Engine.evaluate({ cats: cats(), letter: H.letter, pids: H.roundPids, activePids: active, answers: H.answers, votes: H.votes, overrides: H.overrides });
  }
  function toReview() {
    H.phase = 'review';
    H.collectDeadline = null;
    evaluate();
    changed(true);
  }
  function commitRound() {
    const r = H.review;
    H.rounds.push({ letter: H.letter, stopBy: H.stopBy, pts: Object.assign({}, r.pts), uniques: Object.assign({}, r.uniques) });
    for (const pid of H.roundPids) {
      H.totals[pid] = (H.totals[pid] || 0) + (r.pts[pid] || 0);
      H.uniques[pid] = (H.uniques[pid] || 0) + (r.uniques[pid] || 0);
      H.catPts[pid] = H.catPts[pid] || {};
      for (const c of cats()) H.catPts[pid][c.id] = (H.catPts[pid][c.id] || 0) + ((r.catPts[pid] && r.catPts[pid][c.id]) || 0);
    }
  }

  /** 200 ms'lik ev sahibi döngüsü: zaman kontrolleri, kopan oyuncular, süre yayını. */
  function tick() {
    if (S.closed) return;
    const now = Time.now();
    try {
      if (H.phase === 'reveal' && H.revealDeadline != null && now >= H.revealDeadline) beginPlaying();
      else if (H.phase === 'playing') {
        const end = Math.min(H.deadline != null ? H.deadline : Infinity, H.stopDeadline != null ? H.stopDeadline : Infinity);
        if (now >= end) lock();
        else if (now - lastTickSent >= 1000) { lastTickSent = now; sendTick(); }
      } else if (H.phase === 'collect') {
        const waiting = connectedPlayers().filter(p => H.roundPids.includes(p.pid) && !H.finals.includes(p.pid));
        if (!waiting.length || now >= H.collectDeadline) toReview();
      }
      // Bağlantısı kopan oyuncuyu HOST_GRACE_MS boyunca bekle.
      let dirty = false;
      for (const p of H.players.slice()) {
        if (p.pid === H.hostPid || p.conn || p.left || p.discAt == null) continue;
        if (now - p.discAt >= CONFIG.HOST_GRACE_MS) {
          p.discAt = null;
          if (H.phase === 'lobby') H.players = H.players.filter(x => x.pid !== p.pid);
          else p.left = true;
          Toast.show(`${p.name} odadan çıkarıldı (yanıt yok).`);
          dirty = true;
        }
      }
      if (dirty) { if (H.phase === 'review') evaluate(); changed(); }
    } catch (e) { console.error('[Ishan] Döngü hatası', e); }
  }

  /* ---------- Oyuncu eylemleri (yerel veya ağdan) ---------- */
  function onAnswers(pid, round, a, final) {
    if (round !== H.roundIdx || !H.roundPids.includes(pid)) return;
    if (H.phase === 'playing') {
      if (H.stopBy === pid) return;              // STOP diyenin cevapları kilitli
      H.answers[pid] = a;
      if (final && !H.finals.includes(pid)) H.finals.push(pid);
      changed();
    } else if (H.phase === 'collect') {
      if (H.stopBy !== pid) H.answers[pid] = a;
      if (!H.finals.includes(pid)) H.finals.push(pid);
      persistSoon();
    }
  }
  function onStop(pid, round, a) {
    if (H.phase !== 'playing' || round !== H.roundIdx || H.stopDeadline != null || !H.roundPids.includes(pid)) return;
    if (!Engine.canStop(cats(), a, H.letter)) return;
    H.answers[pid] = a;
    H.stopBy = pid;
    H.stops[pid] = (H.stops[pid] || 0) + 1;
    H.stopDeadline = Time.now() + CONFIG.STOP_COUNTDOWN_MS;
    if (!H.finals.includes(pid)) H.finals.push(pid);
    changed(true);
  }
  function onVote(pid, round, catId, target, v) {
    if (H.phase !== 'review' || round !== H.roundIdx || pid === target || !H.review) return;
    const cell = H.review.rows[catId] && H.review.rows[catId][target];
    const voter = player(pid);
    if (!cell || !cell.votable || !voter || voter.left || !H.roundPids.includes(pid)) return;
    H.votes[catId] = H.votes[catId] || {};
    const list = new Set(H.votes[catId][target] || []);
    if (v) list.add(pid); else list.delete(pid);
    H.votes[catId][target] = [...list];
    evaluate();
    changed();
  }
  function onColor(pid, color) {
    if (H.phase !== 'lobby') return false;
    const p = player(pid);
    if (!p) return false;
    if (H.players.some(x => x.pid !== pid && !x.left && x.color === color)) return false;
    p.color = color;
    changed();
    return true;
  }

  /* ---------- Bağlantılar ---------- */
  function reject(w, reason, extra) {
    w.send(Object.assign({ t: 'reject', reason }, extra || {}));
    setTimeout(() => w.close('reject', true), 600);
  }
  function onHello(w, m) {
    if (m.proto !== CONFIG.PROTOCOL || m.ver !== CONFIG.VERSION) return reject(w, 'version', { hv: CONFIG.VERSION });
    if (m.sig !== DATA_SIGNATURE) return reject(w, 'data', { hv: CONFIG.VERSION });
    if (m.pid === H.hostPid) return reject(w, 'same');
    let p = player(m.pid);
    if (p) {
      // Aynı oyuncu yeniden bağlandı.
      const old = S.conns.get(p.pid);
      if (old && old !== w) old.close('replaced', true);
      p.conn = true; p.discAt = null;
      if (p.left) { p.left = false; Toast.show(`${p.name} geri döndü.`); }
      else Toast.show(`${p.name} yeniden bağlandı.`, 'ok');
    } else {
      if (H.phase !== 'lobby') return reject(w, 'started');
      if (activePlayers().length >= CONFIG.MAX_PLAYERS) return reject(w, 'full', { max: CONFIG.MAX_PLAYERS });
      let name = m.name;
      const names = new Set(H.players.map(x => trLower(x.name)));
      for (let i = 2; names.has(trLower(name)) && i < 20; i++) name = cleanText(m.name, CONFIG.NAME_MAX - 3) + ' ' + i;
      let color = m.color;
      const taken = new Set(activePlayers().map(x => x.color));
      if (taken.has(color)) color = [...PLAYER_COLORS.keys()].find(i => !taken.has(i));
      p = { pid: m.pid, name, color, conn: true, left: false, discAt: null };
      H.players.push(p);
      Toast.show(`${name} odaya katıldı.`, 'ok');
      if (color !== m.color) w.recolored = true;
    }
    w.pid = p.pid;
    clearTimeout(w.helloTimer);
    S.conns.set(p.pid, w);
    w.send({ t: 'welcome', pid: p.pid, room: publicState(), recolored: !!w.recolored });
    if ((H.phase === 'playing' || H.phase === 'collect' || H.phase === 'reveal') && H.answers[p.pid]) {
      w.send({ t: 'restore', round: H.roundIdx, a: H.answers[p.pid] });
    }
    if (H.phase === 'review') evaluate();
    changed();
  }
  function onMessage(raw, w) {
    const m = validateGuestMsg(raw);
    if (!m) return;
    if (!w.pid) { if (m.t === 'hello') onHello(w, m); return; }
    const pid = w.pid;
    if (S.conns.get(pid) !== w) return;     // eski bağlantıdan gelen mesaj
    switch (m.t) {
      case 'answers': onAnswers(pid, m.round, m.a, m.final); break;
      case 'stop': onStop(pid, m.round, m.a); break;
      case 'vote': onVote(pid, m.round, m.cat, m.target, m.v); break;
      case 'color': if (!onColor(pid, m.color)) w.send({ t: 'notice', code: 'color-taken' }); break;
      case 'leave': {
        const p = player(pid);
        S.conns.delete(pid);
        w.close('leave', true);
        if (p) {
          if (H.phase === 'lobby') H.players = H.players.filter(x => x.pid !== pid);
          else { p.left = true; p.conn = false; p.discAt = null; }
          Toast.show(`${p.name} odadan ayrıldı.`);
          if (H.phase === 'review') evaluate();
          changed();
        }
        break;
      }
      default: break;
    }
  }
  function onConnClose(w) {
    if (!w.pid || S.conns.get(w.pid) !== w || S.closed) return;
    S.conns.delete(w.pid);
    const p = player(w.pid);
    if (p && !p.left) {
      p.conn = false; p.discAt = Time.now();
      Toast.show(`${p.name} bağlantısı koptu, bekleniyor…`, 'err');
      if (H.phase === 'review') evaluate();
      changed();
    }
  }
  function attachPeer(peer) {
    S.peer = peer;
    peer.on('connection', (conn) => {
      conn.on('open', () => {
        if (S.closed) { try { conn.close(); } catch (e) { /* yok say */ } return; }
        const w = wrapConn(conn, { onMessage, onClose: () => onConnClose(w) });
        w.helloTimer = setTimeout(() => { if (!w.pid) w.close('nohello', true); }, CONFIG.HELLO_TIMEOUT_MS);
      });
    });
    peer.on('disconnected', () => {
      if (S.closed) return;
      S.serverLost = true; App.render();
      const retry = () => {
        if (S.closed || !S.peer || S.peer.destroyed || !S.peer.disconnected) return;
        try { S.peer.reconnect(); } catch (e) { /* yok say */ }
        setTimeout(retry, CONFIG.RECONNECT_DELAY_MS);
      };
      setTimeout(retry, 1000);
    });
    peer.on('open', () => { if (S.serverLost) { S.serverLost = false; App.render(); } });
    peer.on('error', (e) => console.warn('[Ishan] Peer hatası', e && e.type));
  }

  /** Odayı PeerServer'da açar. Kod meşgulse yeni odada yeni kod üretir, yeniden açılışta bekleyip tekrar dener. */
  S.open = async function () {
    S.status = 'opening'; S.statusInfo = null; App.render();
    let PeerCtor;
    try { PeerCtor = await PeerLoader.load(); }
    catch (e) { S.status = 'failed'; S.statusInfo = 'cdn'; App.render(); return; }
    for (let attempt = 1; attempt <= CONFIG.HOST_OPEN_RETRIES && !S.closed; attempt++) {
      try {
        const peer = await openPeer(PeerCtor, peerIdFor(S.code));
        if (S.closed) { peer.destroy(); return; }
        attachPeer(peer);
        S.status = 'open';
        Tab.setSession(S.code, 'host');
        if (snapshot) {
          // Yeniden açılış: misafirler aynı kimlikle otomatik bağlanacak; 20 sn beklenir.
          const now = Time.now();
          for (const p of H.players) { if (p.pid === H.hostPid) { p.conn = true; p.discAt = null; } else if (!p.left) { p.conn = false; p.discAt = now; } }
          if (H.phase === 'reveal') H.revealDeadline = now + CONFIG.REVEAL_MS;
          if (H.phase === 'collect') H.collectDeadline = now + CONFIG.COLLECT_GRACE_MS;
          snapshot = null;
        }
        tickTimer = setInterval(tick, 200);
        changed(true);
        return;
      } catch (err) {
        if (err.type === 'unavailable-id') {
          if (!snapshot && H.phase === 'lobby' && H.players.length === 1) { S.code = H.code = Engine.makeCode(); continue; }
          S.statusInfo = { attempt, max: CONFIG.HOST_OPEN_RETRIES }; App.render();
          await new Promise(r => setTimeout(r, CONFIG.RECONNECT_DELAY_MS));
          continue;
        }
        S.status = 'failed'; S.statusInfo = err.type === 'browser-incompatible' ? 'browser' : 'network'; App.render();
        return;
      }
    }
    if (!S.closed) { S.status = 'failed'; S.statusInfo = 'taken'; App.render(); }
  };

  /* ---------- Arayüzün çağırdığı eylemler ---------- */
  S.sendAnswers = (a, final) => onAnswers(S.myPid, H.roundIdx, readAnswerMap(a) || {}, final);
  S.stop = (a) => onStop(S.myPid, H.roundIdx, readAnswerMap(a) || {});
  S.vote = (catId, target, v) => onVote(S.myPid, H.roundIdx, catId, target, v);
  S.setColor = (c) => { if (!onColor(S.myPid, c)) Toast.show('Bu renk başka bir oyuncuda.', 'err'); else { const pr = Profile.get(); Profile.set({ name: pr.name, color: c }); } };
  S.override = (catId, target, val) => {
    if (H.phase !== 'review' || !H.review || !H.review.rows[catId] || !H.review.rows[catId][target]) return;
    H.overrides[catId] = H.overrides[catId] || {};
    if (val === 'valid' || val === 'invalid') H.overrides[catId][target] = val; else delete H.overrides[catId][target];
    evaluate(); changed();
  };
  S.updateSettings = (fn) => {
    if (H.phase !== 'lobby') return;
    const draft = JSON.parse(JSON.stringify({ rounds: H.settings.rounds, duration: H.settings.duration, catIds: H.settings.catIds, custom: H.settings.custom, letters: H.settings.letters }));
    const res = fn(draft);
    if (res === false) return;
    H.settings = sanitizeSettings(draft);
    SavedSettings.set(H.settings);
    changed();
  };
  S.startBlockers = () => {
    const out = [];
    if (connectedPlayers().length < CONFIG.MIN_PLAYERS) out.push(`Başlamak için en az ${CONFIG.MIN_PLAYERS} bağlı oyuncu gerekli.`);
    if (Engine.letterPool(H.settings.letters).length < H.settings.rounds) out.push(`${H.settings.rounds} tur için harf havuzunda en az ${H.settings.rounds} harf olmalı.`);
    if (cats().length < CONFIG.MIN_CATS || cats().length > CONFIG.MAX_CATS) out.push(`Kategori sayısı ${CONFIG.MIN_CATS} ile ${CONFIG.MAX_CATS} arasında olmalı.`);
    return out;
  };
  S.startMatch = () => {
    if (H.phase !== 'lobby' || S.startBlockers().length) return;
    H.players = H.players.filter(p => !p.left);
    freshMatch();
    startRound(0);
  };
  S.forceEnd = () => {
    if (H.phase !== 'playing' || H.stopDeadline != null) return;
    H.forced = true;
    H.stopDeadline = Time.now() + CONFIG.STOP_COUNTDOWN_MS;
    changed(true);
  };
  S.nextRound = () => {
    if (H.phase !== 'review' || !H.review) return;
    commitRound();
    if (H.roundIdx + 1 < H.settings.rounds) startRound(H.roundIdx + 1);
    else { resetRoundState(); H.phase = 'final'; changed(true); }
  };
  S.rematch = () => {
    if (H.phase !== 'final') return;
    H.players = H.players.filter(p => !p.left);
    if (connectedPlayers().length < CONFIG.MIN_PLAYERS) { Toast.show('Rövanş için en az 2 bağlı oyuncu gerekli.', 'err'); return; }
    freshMatch();
    startRound(0);
  };
  S.toLobby = () => {
    if (H.phase !== 'final') return;
    H.players = H.players.filter(p => !p.left);
    freshMatch();
    H.phase = 'lobby';
    changed(true);
  };
  /** Odayı kapatır: herkese bildirir, bağlantıları ve kaydı siler. */
  S.close = () => {
    if (S.closed) return;
    for (const w of S.conns.values()) w.send({ t: 'closed' });
    S.closed = true;
    clearInterval(tickTimer); clearTimeout(persistTimer); clearTimeout(bcastTimer);
    setTimeout(() => {
      for (const w of S.conns.values()) w.close('closed', true);
      S.conns.clear();
      try { if (S.peer) S.peer.destroy(); } catch (e) { /* yok say */ }
    }, 300);
    Store.remove(LS, 'ishan:hostroom');
    Tab.clearSession();
  };
  S.retry = () => S.open();
  S.isActiveRoom = () => !S.closed && S.status === 'open';
  return S;
}

/** Kayıtlı ev sahibi odasını doğrulayarak yükler (bozuksa null). */
function loadHostSnapshot() {
  const d = Store.read(LS, 'ishan:hostroom');
  try {
    if (!isObj(d) || !Number.isFinite(d.savedAt) || Date.now() - d.savedAt > CONFIG.HOST_ROOM_TTL_MS) return null;
    const H = d.H;
    if (!isObj(H) || !Engine.isValidCode(H.code) || !isPid(H.hostPid) || !PHASES.includes(H.phase) || !Array.isArray(H.players)) return null;
    const players = H.players.filter(p => isObj(p) && isPid(p.pid)).slice(0, CONFIG.MAX_PLAYERS + 4).map(p => ({
      pid: p.pid, name: cleanText(p.name, CONFIG.NAME_MAX) || 'Oyuncu', color: clampInt(p.color, 0, 7, 0), conn: false, left: p.left === true, discAt: null,
    }));
    if (!players.some(p => p.pid === H.hostPid)) return null;
    const pids = new Set(players.map(p => p.pid));
    const settings = sanitizeSettings(H.settings);
    const catIds = new Set(settings.cats.map(c => c.id));
    const intMap = (o, max) => pidMap(o, intVal(max), pids);
    const nestedMap = (o, fn) => (isObj(o) ? Object.fromEntries(Object.entries(o).filter(([k]) => catIds.has(k)).map(([k, v]) => [k, fn(v)])) : {});
    const answers = pidMap(H.answers, (a) => readAnswerMap(a) || {}, pids);
    const toAbs = (x) => (Number.isFinite(x) ? Time.now() + x : null);
    const snap = {
      code: H.code, hostPid: H.hostPid, phase: H.phase, settings, players,
      matchId: typeof H.matchId === 'string' ? H.matchId.slice(0, 24) : 'm' + randId(10),
      roundIdx: isInt(H.roundIdx, -1, 9) ? H.roundIdx : -1,
      letter: PLAYABLE_LETTERS.includes(H.letter) ? H.letter : null,
      usedLetters: Array.isArray(H.usedLetters) ? H.usedLetters.filter(l => PLAYABLE_LETTERS.includes(l)) : [],
      rounds: Array.isArray(H.rounds) ? H.rounds.slice(0, 10).filter(isObj).map(r => ({ letter: PLAYABLE_LETTERS.includes(r.letter) ? r.letter : '?', stopBy: pids.has(r.stopBy) ? r.stopBy : null, pts: intMap(r.pts, 1000), uniques: intMap(r.uniques, 10) })) : [],
      totals: intMap(H.totals, 100000), stops: intMap(H.stops, 100), uniques: intMap(H.uniques, 1000),
      catPts: pidMap(H.catPts, (m) => nestedMap(m, v => clampInt(v, 0, 10000, 0)), pids),
      answers,
      finals: Array.isArray(H.finals) ? H.finals.filter(p => pids.has(p)) : [],
      votes: nestedMap(H.votes, (m) => pidMap(m, (l) => (Array.isArray(l) ? l.filter(p => pids.has(p)) : []), pids)),
      overrides: nestedMap(H.overrides, (m) => pidMap(m, (v) => (v === 'valid' || v === 'invalid' ? v : undefined), pids)),
      review: null,
      deadline: toAbs(H.deadline), stopDeadline: toAbs(H.stopDeadline), revealDeadline: toAbs(H.revealDeadline), collectDeadline: toAbs(H.collectDeadline),
      stopBy: pids.has(H.stopBy) ? H.stopBy : null, forced: H.forced === true,
      roundPids: Array.isArray(H.roundPids) ? H.roundPids.filter(p => pids.has(p)) : [],
    };
    if (snap.phase !== 'lobby' && (!snap.letter || snap.roundIdx < 0)) snap.phase = 'lobby';
    if (snap.phase === 'review') {
      const active = snap.roundPids.filter(pid => pid === snap.hostPid);
      snap.review = Engine.evaluate({ cats: settings.cats, letter: snap.letter, pids: snap.roundPids, activePids: active, answers, votes: snap.votes, overrides: snap.overrides });
    }
    return snap;
  } catch (e) {
    console.warn('[Ishan] Kayıtlı oda okunamadı', e);
    return null;
  }
}

/* =========================================================================
 * 10. ODA YÖNETİMİ – MİSAFİR
 * ========================================================================= */
function createGuestSession(code, profile, resume) {
  const S = {
    role: 'guest', code, myPid: Tab.pid(), status: 'connecting', statusInfo: null,
    room: null, peer: null, w: null, closed: false, tries: 0, everOpened: false,
  };
  let loopTimer = null;

  function handleState(room, isWelcome) {
    const clean = sanitizeRoom(room);
    if (!clean) { console.warn('[Ishan] Geçersiz oda durumu yok sayıldı'); return; }
    S.room = clean;
    App.onRoomState(clean, isWelcome);
  }
  function onMessage(m) {
    switch (m.t) {
      case 'state': handleState(m.room, false); break;
      case 'tick':
        if (isInt(m.ri, -1, 9) && isObj(m.timer)) App.onTick({
          remaining: numOrNull(m.timer.remaining, 3600000), stopRemaining: numOrNull(m.timer.stopRemaining, 60000),
          reveal: numOrNull(m.timer.reveal, 10000),
        }, m.ri);
        break;
      case 'restore': {
        const a = readAnswerMap(m.a);
        if (a && isInt(m.round, 0, 9)) App.onRestore(m.round, a);
        break;
      }
      case 'notice':
        if (m.code === 'color-taken') Toast.show('Bu renk başka bir oyuncuda.', 'err');
        break;
      case 'closed':
        S.closed = true;
        cleanup();
        Tab.clearSession();
        App.showState({ type: 'closed', code: S.code });
        break;
      default: break;
    }
  }
  function cleanup() {
    clearTimeout(loopTimer);
    if (S.w) S.w.close('cleanup', true);
    S.w = null;
    try { if (S.peer) S.peer.destroy(); } catch (e) { /* yok say */ }
    S.peer = null;
  }

  /** Tek bağlantı denemesi: welcome gelince çözülür, aksi halde hata türüyle reddedilir. */
  async function connectOnce() {
    const PeerCtor = await PeerLoader.load();
    if (!S.peer || S.peer.destroyed || S.peer.disconnected) {
      try { if (S.peer) S.peer.destroy(); } catch (e) { /* yok say */ }
      S.peer = null;
      S.peer = await openPeer(PeerCtor, null);
      S.peer.on('error', (e) => console.warn('[Ishan] Peer hatası', e && e.type));
    }
    const peer = S.peer;
    return new Promise((resolve, reject) => {
      let done = false;
      const conn = peer.connect(peerIdFor(S.code), { reliable: true, serialization: 'raw' });
      const fail = (type) => {
        if (done) return; done = true;
        clearTimeout(timer); peer.off('error', onPeerErr);
        try { conn.close(); } catch (e) { /* yok say */ }
        reject(type);
      };
      const onPeerErr = (err) => {
        const t = err && err.type;
        if (t === 'peer-unavailable') fail({ type: 'notfound' });
        else if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected', 'unavailable-id'].includes(t)) fail({ type: 'network' });
      };
      peer.on('error', onPeerErr);
      const timer = setTimeout(() => fail({ type: 'timeout' }), CONFIG.CONNECT_TIMEOUT_MS);
      conn.on('open', () => {
        const w = wrapConn(conn, {
          onMessage: (m) => {
            if (!done) {
              if (m.t === 'welcome' && isPid(m.pid) && isObj(m.room)) {
                done = true; clearTimeout(timer); peer.off('error', onPeerErr);
                S.w = w;
                resolve(m);
              } else if (m.t === 'reject') {
                const reason = ['version', 'data', 'full', 'started', 'same'].includes(m.reason) ? m.reason : 'unknown';
                const hv = typeof m.hv === 'string' ? m.hv.slice(0, 16) : '';
                fail({ type: 'reject', reason, hv });
              }
              return;
            }
            onMessage(m);
          },
          onClose: () => { if (!done) fail({ type: 'network' }); else if (S.w === w) onLost(); },
        });
        w.send({ t: 'hello', pid: S.myPid, name: profile.name, color: profile.color, ver: CONFIG.VERSION, sig: DATA_SIGNATURE, proto: CONFIG.PROTOCOL });
      });
    });
  }

  function opened(m) {
    S.status = 'open'; S.tries = 0; S.statusInfo = null;
    const first = !S.everOpened;
    S.everOpened = true;
    Tab.setSession(S.code, 'guest');
    if (m.recolored) Toast.show('Seçtiğin renk alınmıştı, sana başka bir renk verildi.');
    handleState(m.room, true);
    if (!first) Toast.show('Bağlantı yeniden kuruldu.', 'ok');
  }
  function onLost() {
    if (S.closed) return;
    S.w = null;
    S.status = 'reconnecting'; S.tries = 0;
    App.render();
    loop();
  }
  /** Yeniden bağlanma: RECONNECT_TRIES deneme, aralarında RECONNECT_DELAY_MS. */
  async function loop() {
    if (S.closed || S.status === 'open') return;
    S.tries++;
    S.statusInfo = { attempt: S.tries, max: CONFIG.RECONNECT_TRIES };
    App.render();
    try {
      const m = await connectOnce();
      if (S.closed) return;
      opened(m);
    } catch (err) {
      if (S.closed) return;
      if (err && err.type === 'reject') { S.closed = true; cleanup(); Tab.clearSession(); App.showState({ type: 'reject', reason: err.reason, hv: err.hv, code: S.code }); return; }
      if (err && err.type === 'cdn') { S.status = 'failed'; App.showState({ type: 'failed', reason: 'cdn', code: S.code }); return; }
      if (S.tries >= CONFIG.RECONNECT_TRIES) {
        S.status = 'failed';
        cleanup();
        App.showState({ type: 'failed', reason: 'lost', code: S.code });
        return;
      }
      loopTimer = setTimeout(loop, CONFIG.RECONNECT_DELAY_MS);
    }
  }

  /** İlk katılım: yanlış kod → "Oda bulunamadı"; diğer hatalar → "Bağlantı kurulamadı". */
  S.open = async function () {
    if (resume) { S.status = 'reconnecting'; S.tries = 0; loop(); return; }
    S.status = 'connecting'; App.render();
    try {
      const m = await connectOnce();
      if (S.closed) return;
      opened(m);
    } catch (err) {
      if (S.closed) return;
      cleanup();
      S.status = 'failed';
      const t = err && err.type;
      if (t === 'notfound') App.showState({ type: 'notfound', code: S.code });
      else if (t === 'reject') App.showState({ type: 'reject', reason: err.reason, hv: err.hv, code: S.code });
      else App.showState({ type: 'failed', reason: t === 'cdn' ? 'cdn' : t === 'browser-incompatible' ? 'browser' : 'network', code: S.code });
    }
  };
  S.retry = () => { S.closed = false; S.tries = 0; if (S.everOpened) { S.status = 'reconnecting'; loop(); } else S.open(); };
  const send = (msg) => (S.w ? S.w.send(msg) : false);
  S.sendAnswers = (a, final) => S.room && send({ t: 'answers', round: S.room.roundIdx, a, final: !!final });
  S.stop = (a) => S.room && send({ t: 'stop', round: S.room.roundIdx, a });
  S.vote = (cat, target, v) => S.room && send({ t: 'vote', round: S.room.roundIdx, cat, target, v });
  S.setColor = (c) => { send({ t: 'color', color: c }); const pr = Profile.get(); Profile.set({ name: pr.name, color: c }); };
  S.leave = () => { send({ t: 'leave' }); S.closed = true; setTimeout(cleanup, 250); Tab.clearSession(); };
  S.isActiveRoom = () => !S.closed && (S.status === 'open' || S.status === 'reconnecting');
  return S;
}

/** Yerel saat: ev sahibinden gelen "kalan süre" değerlerinden yerel bitiş anı üretir. */
const Clock = {
  key: null, main: null, stop: null, reveal: null,
  sync(t, key) {
    const now = Time.now();
    const same = key === Clock.key;
    Clock.key = key;
    const upd = (cur, rem) => (rem == null ? null : (same && cur != null && Math.abs(now + rem - cur) < 350 ? cur : now + rem));
    Clock.main = upd(Clock.main, t.remaining);
    Clock.stop = upd(Clock.stop, t.stopRemaining);
    Clock.reveal = upd(Clock.reveal, t.reveal);
  },
  left(which) { const d = Clock[which]; return d == null ? null : Math.max(0, d - Time.now()); },
};

/** Bu cihazdaki oyuncunun cevapları (tur anahtarına bağlı). */
const Mine = {
  key: null, a: {}, finalSent: false, sendTimer: null,
  ensure(room) {
    const key = `${room.code}:${room.matchId}:${room.roundIdx}`;
    if (key !== Mine.key) {
      Mine.key = key;
      Mine.a = Tab.getDraft(key) || {};
      Mine.finalSent = false;
      clearTimeout(Mine.sendTimer);
    }
  },
  set(catId, value) {
    Mine.a[catId] = String(value).slice(0, CONFIG.ANSWER_MAX);
    Tab.setDraft(Mine.key, Mine.a);
    clearTimeout(Mine.sendTimer);
    Mine.sendTimer = setTimeout(() => { const S = App.session; if (S && S.room && S.room.phase === 'playing') S.sendAnswers(Mine.a, false); }, 300);
  },
  sendFinal() {
    const S = App.session;
    if (Mine.finalSent || !S) return;
    Mine.finalSent = true;
    clearTimeout(Mine.sendTimer);
    S.sendAnswers(Mine.a, true);
  },
};

const App = {
  session: null,
  route: { path: '', query: {} },
  stateScreen: null,
  afterProfile: null,
  profileColor: null,
  lastPhaseKey: null,
  lastLocked: null,
  revealAnim: { key: null, timer: null },
  chart: null,
  renderQueued: false,
  focusNext: null,

  render() {
    if (App.renderQueued) return;
    App.renderQueued = true;
    requestAnimationFrame(() => { App.renderQueued = false; renderNow(); });
  },

  /** Oda durumu her güncellendiğinde (ev sahibi yerelde, misafir ağdan) çağrılır. */
  onRoomState(room, isWelcome) {
    try {
      Mine.ensure(room);
      Clock.sync(room.timer, `${room.matchId}:${room.roundIdx}:${room.phase === 'reveal' ? 'r' : 'p'}`);
      const phaseKey = `${room.matchId}:${room.roundIdx}:${room.phase}`;
      const phaseChanged = phaseKey !== App.lastPhaseKey;
      App.lastPhaseKey = phaseKey;
      if (room.phase === 'collect') Mine.sendFinal();
      if (room.phase === 'final') saveHistory(room);
      if (room.phase === 'reveal') startRevealAnim(room);
      if (isWelcome && App.route.path !== 'masa') go('#/masa');
      // Dokunmatik cihazda ilk alana otomatik odaklanılmaz; alt yuva (STOP) görünür kalır.
      const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (phaseChanged) App.focusNext = room.phase === 'playing' && !coarse ? 'answer' : 'heading';
      App.render();
    } catch (e) { console.error('[Ishan] Durum işlenemedi', e); }
  },
  onTick(timer, ri) {
    const S = App.session;
    if (!S || !S.room || S.room.roundIdx !== ri) return;
    Clock.sync(timer, `${S.room.matchId}:${ri}:${S.room.phase === 'reveal' ? 'r' : 'p'}`);
  },
  onRestore(round, a) {
    const S = App.session;
    if (!S || !S.room || S.room.roundIdx !== round) return;
    const hasLocal = Object.values(Mine.a).some(v => v && v.trim());
    if (!hasLocal) {
      Mine.a = Object.assign({}, a);
      Tab.setDraft(Mine.key, Mine.a);
      document.querySelectorAll('[data-ans]').forEach(el => { const v = Mine.a[el.getAttribute('data-ans')]; if (v && !el.value) el.value = v; });
    }
    App.render();
  },
  showState(st) {
    App.stateScreen = st;
    if (App.route.path === 'durum') App.render(); else go('#/durum');
  },
};

const S_ = () => App.session;
const me = () => (App.session ? App.session.myPid : null);
const isHostMe = () => !!App.session && App.session.role === 'host';
const playerOf = (room, pid) => room.players.find(p => p.pid === pid) || { pid, name: 'Oyuncu', color: 0, conn: false, left: true };
const go = (hash) => { if (location.hash !== hash) location.hash = hash; else { App.route = parseHash(); App.render(); } };

function parseHash() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  let query = {};
  try { query = Object.fromEntries(new URLSearchParams(qs || '')); } catch (e) { query = {}; }
  return { path: (path || '').replace(/\/+$/, ''), query };
}

/** Oyuncunun yerelde kilitli olup olmadığı (süre bitti / STOP dedi / tur bitti). */
function isLocked(room) {
  if (room.phase !== 'playing') return true;
  if (room.timer.stopBy && room.timer.stopBy === me()) return true;
  if (Clock.main != null && Clock.left('main') === 0) return true;
  if (Clock.stop != null && Clock.left('stop') === 0) return true;
  return false;
}

/** Maç sonu: yerel geçmişe (bir kez) kaydeder. */
function saveHistory(room) {
  try {
    const myPid = me();
    if (!room.matchId || !room.rounds.length || History.has(room.matchId)) return;
    const mePl = room.players.find(p => p.pid === myPid);
    if (!mePl) return;
    const ranked = Engine.rank(room.players.map(p => p.pid), room.totals);
    const rankOf = Object.fromEntries(ranked.map(r => [r.pid, r.rank]));
    const cats = {};
    const mine = (room.catPts && room.catPts[myPid]) || {};
    for (const c of room.settings.cats) cats[c.name] = { pts: mine[c.id] || 0, n: room.rounds.length };
    History.add({
      id: room.matchId, ts: Date.now(), code: room.code, rounds: room.rounds.length,
      players: room.players.map(p => ({ name: p.name, color: p.color, total: room.totals[p.pid] || 0, rank: rankOf[p.pid] || 1, me: p.pid === myPid })),
      myRank: rankOf[myPid] || 1, myTotal: room.totals[myPid] || 0, won: rankOf[myPid] === 1, cats,
    });
  } catch (e) { console.warn('[Ishan] Geçmiş kaydedilemedi', e); }
}


/**
 * Harf çarkı: harfler dikey bir makarada akar ve ev sahibinin belirlediği
 * anda turun harfinde durur. Yalnızca transform kullanılır.
 */
function startRevealAnim(room) {
  const key = `${room.matchId}:${room.roundIdx}`;
  if (App.revealAnim.key === key) return;
  App.revealAnim.key = key;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pool = (room.settings.letters.length ? room.settings.letters : PLAYABLE_LETTERS).filter(l => l !== room.letter);
  let tries = 0;
  const build = () => {
    const S = App.session;
    if (!S || !S.room || S.room.phase !== 'reveal' || `${S.room.matchId}:${S.room.roundIdx}` !== key) return;
    const reel = document.querySelector('[data-reel]');
    if (!reel) { if (tries++ < 20) setTimeout(build, 40); return; }
    const win = reel.parentElement;
    const cell = win.clientHeight || 160;
    const seq = [];
    if (!reduce) for (let i = 0; i < 22; i++) seq.push(pool.length ? pool[(i * 5 + room.roundIdx * 3) % pool.length] : '?');
    seq.push(S.room.letter || '?');
    win.style.setProperty('--cell', cell + 'px');
    reel.innerHTML = seq.map(l => `<span>${esc(l)}</span>`).join('');
    reel.style.transition = 'none';
    reel.style.transform = 'translateY(0)';
    const left = Math.max(300, (Clock.left('reveal') || CONFIG.REVEAL_MS) - 180);
    const land = () => {
      const dial = win.closest('.dial');
      if (dial) dial.classList.add('landed');
      const lbl = document.querySelector('[data-reveal-label]');
      if (lbl) lbl.textContent = `Harf ${S.room.letter}`;
    };
    if (reduce) { land(); return; }
    void reel.offsetHeight;  // yeniden akışı zorla, geçiş başlangıcını sabitle
    reel.style.transition = `transform ${left}ms cubic-bezier(.12,.82,.18,1)`;
    reel.style.transform = `translateY(${-(seq.length - 1) * cell}px)`;
    reel.addEventListener('transitionend', land, { once: true });
  };
  setTimeout(build, 30);
}

/** Sayıların kısa bir sayımla yerine oturması (yalnızca metin değişir). */
const counted = new WeakMap();
function animateCounts(root) {
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = parseInt(el.getAttribute('data-count'), 10);
    if (!Number.isFinite(to)) return;
    const prev = counted.get(el);
    if (prev === to) return;
    counted.set(el, to);
    const from = prev == null ? Math.max(0, to - Math.max(10, Math.round(to * 0.35))) : prev;
    if (reduce || from === to) { el.textContent = String(to); return; }
    const t0 = performance.now(), dur = 650;
    const step = (t) => {
      if (counted.get(el) !== to) return;
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = String(Math.round(from + (to - from) * e));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

    const winners = e.players.filter(p => p.rank === 1);
    return html`<li data-key="h-${e.id}"><div style="min-width:0"><div class="t">${winners.map(w => w.name).join(', ')} kazandı</div>
        <div class="small">${e.players.length} oyuncu, ${e.rounds} tur, ${Time.shortDate(e.ts)}</div></div>
      <div class="rank${e.won ? ' won' : ''}"><span class="num">${e.myRank}.</span><span class="small">${e.myTotal} puan</span></div></li>`;
  })}</ul>`;
}

/* ---------- Bağlanıyor / durum ekranları ---------- */
function viewConnecting(S) {
  const host = S.role === 'host';
  let title = host ? 'Oda açılıyor' : 'Odaya bağlanılıyor';
  let sub = host ? 'Bağlantı sunucusuna kaydolunuyor.' : 'Ev sahibine bağlanılıyor.';
  if (S.status === 'reconnecting') { title = 'Yeniden bağlanılıyor'; sub = `Deneme ${(S.statusInfo && S.statusInfo.attempt) || 1} / ${CONFIG.RECONNECT_TRIES}`; }
  if (host && S.statusInfo && S.statusInfo.attempt) sub = `Kod önceki oturumda hâlâ açık görünüyor. Tekrar deneniyor (${S.statusInfo.attempt} / ${S.statusInfo.max}).`;
  return html`<section class="view state" aria-busy="true">
    <span class="spinner" aria-hidden="true"></span><h1 class="title-m" tabindex="-1">${title}</h1>
    <span class="code-tag">${S.code}</span><p class="muted">${sub}</p>
    <button type="button" class="btn btn-quiet" data-action="cancel-connect">Vazgeç</button></section>`;
}

function viewState(st) {
  if (!st) return viewHome();
  const code = st.code || '';
  const homeBtn = html`<a class="btn" href="#/">Ana sayfa</a>`;
  const screen = (glyph, gcls, title, body, btns) => html`<section class="view state">
    <span class="glyph ${gcls}" aria-hidden="true">${glyph}</span><h1 class="title-l" tabindex="-1">${title}</h1>
    ${code ? html`<span class="code-tag">${code}</span>` : ''}<p class="muted">${body}</p><div class="btns">${btns}</div></section>`;
  if (st.type === 'notfound') return screen('?', 'err', 'Oda bulunamadı', 'Bu kodla açık bir oda yok. Kodu kontrol et veya ev sahibinden yeni bir davet bağlantısı iste.', html`<a class="btn btn-primary" href="#/oda?kod=${code}">Kodu değiştir</a>${homeBtn}`);
  if (st.type === 'closed') return screen('×', 'warn', 'Oda kapatıldı', 'Ev sahibi odayı kapattı. Yeni bir maç için yeni bir kod gerekir.', html`<a class="btn btn-primary" href="#/oda">Başka odaya katıl</a>${homeBtn}`);
  if (st.type === 'reject') {
    const msgs = {
      version: `Oyun sürümleri uyuşmuyor (ev sahibi ${st.hv || '?'}, sen ${CONFIG.VERSION}). İkiniz de sayfayı yenileyip tekrar deneyin.`,
      data: `Oyun verileri ev sahibininkiyle uyuşmuyor (sürüm ${st.hv || '?'}). İkiniz de sayfayı yenileyip tekrar deneyin.`,
      full: `Oda dolu. Bir odada en fazla ${CONFIG.MAX_PLAYERS} oyuncu olabilir.`,
      started: 'Bu odada maç başladı; şu an yeni oyuncu alınmıyor. Maç bitip lobiye dönüldüğünde tekrar dene.',
      same: 'Bu sekme zaten odanın ev sahibi. Katılmak için başka bir tarayıcı veya cihaz kullan.',
      unknown: 'Ev sahibi katılım isteğini reddetti.',
    };
    return screen('!', 'err', 'Odaya katılamadın', msgs[st.reason] || msgs.unknown, html`<a class="btn btn-primary" href="#/oda?kod=${code}">Tekrar dene</a>${homeBtn}`);
  }
  const reasons = {
    cdn: 'Bağlantı kütüphanesi yüklenemedi. İnternet bağlantını kontrol edip tekrar dene.',
    network: 'Bağlantı sunucusuna ulaşılamadı. İnternet bağlantını veya ?peer adresini kontrol et.',
    lost: `Odayla bağlantı ${CONFIG.RECONNECT_TRIES} denemede kurulamadı. Ev sahibi çevrimdışı olabilir.`,
    taken: 'Bu oda kodu başka bir oturumda hâlâ açık görünüyor. Biraz bekleyip tekrar dene.',
    browser: 'Bu tarayıcı WebRTC bağlantısını desteklemiyor. Güncel Chrome, Safari veya Firefox kullan.',
  };
  return screen('!', 'err', 'Bağlantı kurulamadı', reasons[st.reason] || reasons.network,
    html`${S_() && !S_().closed ? html`<button type="button" class="btn btn-primary" data-action="retry">Tekrar dene</button>` : ''}${homeBtn}`);
}

function viewReopen() {
  const snap = loadHostSnapshot();
  if (!snap) {
    return html`<section class="view state"><span class="glyph warn" aria-hidden="true">–</span><h1 class="title-l" tabindex="-1">Kayıtlı oda yok</h1>
      <p class="muted">Yeniden açılabilecek bir oda bulunamadı.</p><div class="btns"><a class="btn btn-primary" href="#/">Ana sayfa</a></div></section>`;
  }
  const phaseText = { lobby: 'Lobideydiniz', reveal: `${snap.roundIdx + 1}. tur başlıyordu`, playing: `${snap.roundIdx + 1}. tur oynanıyordu`, collect: `${snap.roundIdx + 1}. tur bitiyordu`, review: `${snap.roundIdx + 1}. tur değerlendiriliyordu`, final: 'Maç bitmişti' }[snap.phase];
  const others = snap.players.filter(p => p.pid !== snap.hostPid && !p.left).length;
  return html`<section class="view state" style="gap:18px">
    <h1 class="title-l" tabindex="-1">Odayı yeniden aç</h1>
    ${codeBoxes(snap.code)}
    <p class="muted">Sayfa yenilendiği için oda geçici olarak kapandı. Aynı kodla açarsan oyuncular kendiliğinden bağlanır.</p>
    <p class="small">${phaseText}, ${others} misafir.</p>
    <div class="btns" style="flex-direction:column"><button type="button" class="btn btn-primary btn-lg btn-block" data-action="reopen-room">Odayı yeniden aç</button>
    <button type="button" class="btn btn-quiet btn-block" data-action="discard-room">Odayı sil</button></div></section>`;
}

/* ---------- Lobi ---------- */
function viewLobby(S, room) {
  const host = isHostMe();
  const st = room.settings;
  const myP = playerOf(room, me());
  const active = room.players.filter(p => !p.left);
  const taken = new Set(active.filter(p => p.pid !== me()).map(p => p.color));
  const segBtn = (action, val, cur, label) => html`<button type="button" aria-pressed="${val === cur ? 'true' : 'false'}"${host ? raw(` data-action="${action}" data-val="${val}"`) : raw(' aria-disabled="true"')}>${label}</button>`;
  const enabledIds = new Set(st.catIds);
  const allCats = [...CATEGORY_DEFS.map(c => ({ id: c.id, name: c.name })), ...st.custom.map(c => ({ id: c.id, name: c.name }))];
  const pool = Engine.letterPool(st.letters);
  const rareOn = RARE_LETTERS.every(l => pool.includes(l));
  const blockers = host ? S.startBlockers() : [];
  return html`<section class="view">
    <div class="head"><h1 class="title-l" tabindex="-1">${host ? 'Odan hazır' : 'Lobidesin'}</h1>
      <p class="lead">${host ? 'Kodu veya davet bağlantısını paylaş. Herkes gelince maçı başlat.' : 'Ev sahibi maçı başlattığında ilk tur açılacak.'}</p></div>
    <section class="elite panel" style="display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:clamp(28px,5vw,40px)">
      ${codeBoxes(room.code)}
      <div class="btns" style="width:100%;max-width:440px">
        <button type="button" class="btn" data-action="copy-code">Kodu kopyala</button>
        <button type="button" class="btn btn-primary" data-action="share-link">Davet bağlantısı</button>
      </div>
    </section>
    <div class="split">
      <section class="block" aria-labelledby="pl-h">
        <div class="block-head"><h2 id="pl-h">Oyuncular</h2><span class="small num">${active.length} / ${CONFIG.MAX_PLAYERS}</span></div>
        <ul class="players sheet">${active.map(p => html`<li class="player enter" data-key="pl-${p.pid}"><span class="dot lg" ${colorStyle(p.color)}></span>
          <span class="name">${p.name}${p.pid === me() ? ' (sen)' : ''}</span>
          ${p.pid === room.hostPid ? html`<span class="tag ember">Ev sahibi</span>` : ''}
          <span class="conn${p.conn ? '' : ' off'}">${p.conn ? 'Bağlı' : 'Kopuk'}</span></li>`)}</ul>
        <div class="field" style="margin-top:6px"><span class="label">Rengin</span>${swatches(myP.color, taken, 'my-color', 'Odadaki rengin')}</div>
      </section>
      <section class="block" aria-labelledby="set-h">
        <div class="block-head"><h2 id="set-h">Ayarlar</h2>${host ? '' : html`<span class="small">Ev sahibi belirler</span>`}</div>
        <div class="sheet">
          <div class="setting line"><span class="label" id="r-l">Tur sayısı</span><div class="seg" role="group" aria-labelledby="r-l">${CONFIG.ROUND_OPTIONS.map(n => segBtn('set-rounds', n, st.rounds, String(n)))}</div></div>
          <div class="setting line"><span class="label" id="d-l">Süre</span><div class="seg" role="group" aria-labelledby="d-l">${CONFIG.DURATION_OPTIONS.map(n => segBtn('set-duration', n, st.duration, n ? `${n} sn` : 'Süresiz'))}</div></div>
          <div class="setting line"><div class="sh"><span class="label" id="c-l">Kategoriler</span><span class="small num">${st.catIds.length} / ${CONFIG.MAX_CATS}</span></div>
            <div class="chips" role="group" aria-labelledby="c-l">${allCats.filter(c => host || enabledIds.has(c.id)).map(c => html`<button type="button" class="chip" data-key="cat-${c.id}" aria-pressed="${enabledIds.has(c.id) ? 'true' : 'false'}"${host ? raw(` data-action="toggle-cat" data-id="${esc(c.id)}"`) : raw(' aria-disabled="true"')}>${c.name}</button>`)}</div>
            ${host && st.custom.length ? html`<div class="chips" aria-label="Özel kategorileri sil">${st.custom.map(c => html`<button type="button" class="chip" data-key="del-${c.id}" data-action="remove-cat" data-id="${c.id}" aria-label="${c.name} kategorisini sil"><span class="x" aria-hidden="true">×</span>${c.name}</button>`)}</div>` : ''}
            ${host && st.custom.length < CONFIG.CUSTOM_CAT_LIMIT ? html`<form data-form="add-cat" style="display:flex;gap:8px" novalidate>
                <label class="sr-only" for="custom-cat">Özel kategori adı</label>
                <input class="input" id="custom-cat" maxlength="${CONFIG.CUSTOM_CAT_MAX}" placeholder="Kendi kategorini ekle" autocomplete="off" autocapitalize="words" style="flex:1;min-width:0">
                <button type="submit" class="btn">Ekle</button></form>` : ''}
            <span class="hint">En az ${CONFIG.MIN_CATS}, en fazla ${CONFIG.MAX_CATS} kategori.</span></div>
          <div class="setting line"><div class="sh"><span class="label" id="l-l">Harf havuzu</span><span class="small num">${pool.length} harf</span></div>
            <div class="chips" role="group" aria-labelledby="l-l">${PLAYABLE_LETTERS.map(l => html`<button type="button" class="chip letter${RARE_LETTERS.includes(l) ? ' rare' : ''}" data-key="let-${l}" aria-pressed="${pool.includes(l) ? 'true' : 'false'}" aria-label="${l}${RARE_LETTERS.includes(l) ? ' (nadir)' : ''}"${host ? raw(` data-action="toggle-letter" data-l="${esc(l)}"`) : raw(' aria-disabled="true"')}>${l}</button>`)}</div>
            <span class="hint">Kesik çizgililer nadir harfler. Ğ hiç çıkmaz.</span>
            ${host ? html`<div class="btns"><button type="button" class="btn btn-sm" data-action="rare-letters" data-val="${rareOn ? 'off' : 'on'}">${rareOn ? 'Nadir harfleri kapat' : 'Nadir harfleri aç'}</button>
