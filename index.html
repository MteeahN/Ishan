      ${host ? html`${blockers.length ? html`<p class="note" role="status">${blockers[0]}</p>` : ''}
        <button type="button" class="btn btn-primary btn-lg btn-block" data-action="start-match"${attrIf(blockers.length > 0, 'disabled')}>Maçı başlat</button>`
        : html`<div class="waiting"><i></i>Ev sahibinin başlatması bekleniyor</div>`}
    </div>
  </section>`;
}

/* ---------- Tur: harf çarkı ---------- */
function viewReveal(S, room) {
  const reelKey = `reel-${room.matchId}-${room.roundIdx}`;
  return html`<section class="view reveal" aria-live="polite">
    <p class="kicker">Tur ${room.roundIdx + 1} / ${room.settings.rounds}</p>
    <div data-key="${reelKey}">${dial({ glyph: null, kind: 'idle', extra: html`<div class="reel-window" data-morph-skip><div class="reel" data-reel></div></div>` })}</div>
    <h1 class="title-l" tabindex="-1" data-reveal-label data-morph-skip>Harf seçiliyor</h1>
    <p class="cats">${room.settings.cats.map(c => c.name).join(', ')}</p>
  </section>`;
}

/* ---------- Tur ekranı ---------- */
function timerState(room) {
  if (Clock.stop != null) return { kind: 'stop', left: Clock.left('stop'), total: CONFIG.STOP_COUNTDOWN_MS };
  if (Clock.main != null) return { kind: 'main', left: Clock.left('main'), total: room.settings.duration * 1000 };
  return { kind: 'none', left: null, total: null };
}

function viewRound(S, room) {
  const L = room.letter || '?';
  const cats = room.settings.cats;
  const locked = isLocked(room);
  const filled = Engine.filledCount(cats, Mine.a);
  const canStop = !locked && room.timer.stopRemaining == null && Engine.canStop(cats, Mine.a, L);
  const stopper = room.timer.stopBy ? playerOf(room, room.timer.stopBy) : null;
  const others = room.players.filter(p => p.pid !== me() && !p.left);
  const roundKey = `${room.matchId}-${room.roundIdx}`;
  const t = timerState(room);
  const frac = t.total ? t.left / t.total : (room.phase === 'playing' ? 1 : 0);
  const secs = t.left == null ? '∞' : String(Math.ceil(t.left / 1000));
  const urgent = t.kind === 'stop' || (t.left != null && t.left <= 10000);
  let alert = '';
  if (room.phase === 'collect') alert = html`<div class="alert calm" role="status"><div><strong>Cevaplar kilitlendi</strong><span class="small">Değerlendirme hazırlanıyor.</span></div><span class="spinner" aria-hidden="true" style="width:28px;height:28px"></span></div>`;
  else if (room.timer.stopRemaining != null) {
    const mineStop = stopper && stopper.pid === me();
    const who = room.timer.forced || !stopper ? 'Ev sahibi turu bitiriyor' : mineStop ? 'STOP dedin' : `${stopper.name} STOP dedi`;
    alert = html`<div class="alert" role="alert"><div><strong>${who}</strong><span class="small">${mineStop ? 'Cevapların kilitlendi.' : 'Son saniyelerde cevaplarını tamamla.'}</span></div>
      <span class="cd" data-stop-val>${Math.ceil((Clock.left('stop') || 0) / 1000)}</span></div>`;
  }
  let stopNote = `STOP için tüm kategorileri ${L} ile doldur.`;
  if (locked) stopNote = 'Cevapların kilitli.';
  else if (room.timer.stopRemaining != null) stopNote = 'Geri sayım sürüyor.';
  else if (canStop) stopNote = 'Hepsi dolu. STOP dersen diğerlerine 10 saniye kalır.';
  return html`<section class="view round">
    <div class="round-aside">
      <div class="round-top">
        ${dial({ glyph: L, frac, kind: t.kind === 'stop' ? 'stop' : t.kind === 'none' ? 'idle' : '', live: true })}
        <div class="round-meta"><span class="kicker">Tur ${room.roundIdx + 1} / ${room.settings.rounds}</span>
          <div class="secs${urgent ? ' urgent' : ''}" role="timer" aria-label="${t.left == null ? 'Süresiz tur' : 'Kalan süre'}"><span data-timer-val>${secs}</span><small>${t.left == null ? 'süresiz' : 'sn'}</small></div>
          <h1 class="small" tabindex="-1" style="font-family:var(--font-body);font-weight:600;letter-spacing:0">Her cevap ${L} harfiyle başlamalı</h1></div>
      </div>
      <section class="block round-others" aria-labelledby="oth-h" style="gap:4px">
        <h2 class="label" id="oth-h" style="font-family:var(--font-body);color:var(--muted)">Diğer oyuncular</h2>
        <ul class="others sheet">${others.length ? others.map(p => {
          const f = room.fill[p.pid] || 0;
          return html`<li class="other" data-key="oth-${p.pid}" ${colorStyle(p.color)}><span class="dot"></span><span class="name">${p.name}${p.conn ? '' : ' (kopuk)'}</span>
            <span class="fill"><span class="mini" aria-hidden="true"><span style="--p:${(f / cats.length).toFixed(3)}"></span></span><span class="num"><b>${f}</b>/${cats.length} doldurdu</span></span></li>`;
        }) : html`<li class="other"><span class="small">Başka oyuncu yok.</span></li>`}</ul>
        ${isHostMe() && room.phase === 'playing' && room.timer.stopRemaining == null ? html`<button type="button" class="btn btn-danger btn-sm" data-action="force-end" style="margin-top:10px;align-self:flex-start">Turu bitir</button>` : ''}
      </section>
    </div>
    <div class="round-main" style="min-width:0;display:flex;flex-direction:column;gap:16px">
      ${alert}
      <form class="sheet answer-sheet" data-form="answers" novalidate aria-label="Cevaplar">${cats.map((c, i) => {
        const v = Mine.a[c.id] || '';
        const state = !v.trim() ? '' : startsWithLetter(v, L) ? ' good' : ' bad';
        return html`<div class="line"><label for="ans-${c.id}">${c.name}</label>
          <div class="line-input${state}"><span class="mark" aria-hidden="true">${L}</span>
          <input id="ans-${c.id}" data-key="ans-${roundKey}-${c.id}" data-ans="${c.id}" data-idx="${i}" value="${v}" maxlength="${CONFIG.ANSWER_MAX}"
            autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="${i === cats.length - 1 ? 'done' : 'next'}"
            placeholder="${L} ile başlayan ${trLower(c.name)}"${attrIf(state === ' bad', 'aria-invalid', 'true')}${attrIf(locked, 'disabled')}>
          <span class="state" aria-hidden="true">${state === ' bad' ? '!' : '✓'}</span></div></div>`;
      })}</form>
      <div class="dock">
        <div class="dock-row"><span class="num fillcount" style="font-weight:700;min-width:3ch">${filled}/${cats.length}</span>
          <div class="meter" role="progressbar" aria-label="Doluluk" aria-valuemin="0" aria-valuemax="${cats.length}" aria-valuenow="${filled}"><span style="--p:${(filled / cats.length).toFixed(3)}"></span></div></div>
        <button type="button" class="btn btn-primary btn-stop" data-action="stop"${attrIf(!canStop, 'disabled')} aria-describedby="stop-hint">STOP!</button>
        <p class="note" id="stop-hint">${stopNote}</p>
      </div>
    </div>
  </section>`;
}

/* ---------- Değerlendirme ---------- */
function standingsList(room, roundPts) {
  const pids = room.players.filter(p => !p.left || (roundPts[p.pid] || 0) > 0 || (room.totals[p.pid] || 0) > 0).map(p => p.pid);
  const totals = {};
  for (const pid of pids) totals[pid] = (room.totals[pid] || 0) + (roundPts[pid] || 0);
  const ranked = Engine.rank(pids, totals);
  const best = Math.max(0, ...pids.map(pid => roundPts[pid] || 0));
  return html`<ol class="standings">${ranked.map(r => {
    const p = playerOf(room, r.pid);
    const win = best > 0 && (roundPts[r.pid] || 0) === best;
    return html`<li class="stand${win ? ' winner' : ''}" data-key="st-${r.pid}">${win ? html`<span class="win-tag">Turu kazandı</span>` : ''}
      <span class="rank">${r.rank}</span>
      <div class="who"><strong><span class="dot" ${colorStyle(p.color)}></span>${p.name}${p.pid === me() ? ' (sen)' : ''}</strong><span class="sub">Bu tur +${roundPts[r.pid] || 0}</span></div>

function viewReview(S, room) {

  const flag = (key, cls, text) => html`<span class="tag ${cls} stamp" data-key="f-${key}">${text}</span>`;
  return html`<section class="view">
    <div class="review-head">${dial({ glyph: room.letter, kind: 'idle' })}
      <div class="head" style="margin:0"><span class="kicker">Tur ${room.roundIdx + 1} / ${room.settings.rounds}</span><h1 class="title-l" tabindex="-1">Değerlendirme</h1></div></div>
    <p class="lead" style="margin-bottom:28px">Şüpheli bir cevaba itiraz et. Diğer oyuncuların çoğunluğu itiraz ederse cevap 0 puan alır. ${host ? 'Son kararı sen verirsin.' : 'Son kararı ev sahibi verir.'}</p>
    ${room.settings.cats.map(c => html`<section class="cat" data-key="cb-${c.id}" aria-labelledby="ch-${c.id}">
      <div class="cat-title"><h2 id="ch-${c.id}">${c.name}</h2>${c.kind ? html`<span class="tag">Liste kontrolü</span>` : ''}</div>
      <div class="sheet">${pids.map(pid => {
        const cell = rv.rows[c.id] && rv.rows[c.id][pid];
        if (!cell) return '';
        const p = playerOf(room, pid);
        const mineCell = pid === me();
        const flags = [];
        if (cell.empty) flags.push(flag('empty', '', 'Boş'));
        else if (!cell.letterOk) flags.push(flag('letter', 'err', 'Harf uymuyor'));
        if (cell.verified) flags.push(flag('ver', 'ok', 'Doğrulandı'));
        if (cell.notInList) flags.push(flag('nil', 'warn', 'Listede yok'));
        if (cell.dup) flags.push(flag('dup', 'ember', 'Aynı cevap'));
        if (cell.votable && cell.votes.length) flags.push(flag('votes', 'err', `İtiraz ${cell.votes.length}/${cell.voters}`));
        if (cell.override) flags.push(flag('ov-' + cell.override, cell.override === 'valid' ? 'ok' : 'err', `Ev sahibi: ${cell.override === 'valid' ? 'geçerli' : 'geçersiz'}`));
        else if (cell.letterOk && !cell.valid) flags.push(flag('voted', 'err', 'Oylamayla geçersiz'));
        const iVoted = cell.votes.includes(me());
        const canVote = cell.votable && !mineCell && myActive;
        const ov = cell.override || 'auto';
        const judgeBtn = (val, label, aria) => html`<button type="button" class="ov-${val}" data-action="override" data-cat="${c.id}" data-pid="${pid}" data-val="${val}" aria-pressed="${ov === val ? 'true' : 'false'}" aria-label="${p.name}: ${aria}">${label}</button>`;
        return html`<div class="ans-row line${cell.valid ? '' : ' invalid'}" data-key="ar-${c.id}-${pid}">
          <div class="who"><span class="dot" ${colorStyle(p.color)}></span><span>${p.name}${mineCell ? ' (sen)' : ''}</span></div>
          <div class="text${cell.empty ? ' blank' : ''}">${cell.empty ? 'Boş bıraktı' : cell.text}</div>

          ${canVote || (host && !cell.empty) ? html`<div class="acts">
            ${canVote ? html`<button type="button" class="btn btn-sm vote" data-action="vote" data-cat="${c.id}" data-pid="${pid}" aria-pressed="${iVoted ? 'true' : 'false'}">${iVoted ? 'İtirazı geri al' : 'İtiraz et'}</button>` : ''}

/* ---------- Maç sonu ---------- */
function totalsChart(room) {
  const players = room.players.filter(p => room.rounds.some(r => r.pts[p.pid] != null) || room.totals[p.pid] != null);
  const n = room.rounds.length;
  const series = players.map(p => { let acc = 0; return { p, vals: [0, ...room.rounds.map(r => (acc += r.pts[p.pid] || 0))] }; });
  const maxV = Math.max(10, ...series.map(s => s.vals[s.vals.length - 1]));
  const step = maxV <= 60 ? 10 : maxV <= 150 ? 25 : maxV <= 300 ? 50 : 100;
  const yMax = Math.ceil(maxV / step) * step;
  const direct = series.length <= 4;
  const narrow = window.innerWidth < 600;
  const W = narrow ? 340 : 640, Hh = narrow ? 230 : 260, pl = 34, pr = direct ? (narrow ? 84 : 112) : 14, pt = 14, pb = 28;
  const maxName = narrow ? 7 : 11;
  const x = (i) => pl + (n ? (i / n) * (W - pl - pr) : 0);
  const y = (v) => pt + (1 - v / yMax) * (Hh - pt - pb);
  const ticks = [];
  for (let v = 0; v <= yMax; v += step) ticks.push(v);
  const xLabels = ['0', ...room.rounds.map(r => r.letter)];
  App.chart = { xLabels, series: series.map(s => ({ name: s.p.name, color: s.p.color, vals: s.vals })) };
  const ends = series.map((s, i) => ({ i, y: y(s.vals[n]), name: s.p.name, v: s.vals[n] })).sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 15) ends[k].y = ends[k - 1].y + 15;
  const colW = n ? (W - pl - pr) / n : 0;
  return html`<div class="chart-wrap" data-chart>
    <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Turlara göre toplam puan grafiği. Ayrıntılar aşağıdaki tabloda.">
      ${ticks.map(v => html`<line class="gridline" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"></line><text class="axis-label" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`)}
      ${xLabels.map((lb, i) => html`<text class="axis-label" x="${x(i)}" y="${Hh - 8}" text-anchor="middle">${lb}</text>`)}
      <line class="xhair" data-xhair x1="0" x2="0" y1="${pt}" y2="${Hh - pb}" visibility="hidden"></line>
      ${series.map(s => html`<path class="series" d="${s.vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" stroke="${PLAYER_COLORS[s.p.color].hex}"></path>`)}
      ${series.map(s => s.vals.map((v, i) => html`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="${PLAYER_COLORS[s.p.color].hex}" stroke="#0b0d12" stroke-width="2"></circle>`))}
      ${direct ? ends.map(e => html`<text x="${x(n) + 10}" y="${e.y + 4}" fill="#f5f5f5" font-size="12" font-weight="700" font-family="Manrope, system-ui, sans-serif">${e.name.length > maxName ? e.name.slice(0, maxName - 1) + '…' : e.name} ${e.v}</text>`) : ''}
      ${xLabels.map((lb, i) => html`<rect class="hit" data-chart-i="${i}" x="${Math.max(0, x(i) - colW / 2)}" y="${pt}" width="${Math.max(24, colW)}" height="${Hh - pt - pb}"></rect>`)}
    </svg>
    <div class="chart-tip" data-chart-tip role="presentation"></div>
    <div class="legend">${series.map(s => html`<span ${colorStyle(s.p.color)}><i></i>${s.p.name}</span>`)}</div>
  </div>`;
}

function viewFinal(S, room) {
  const host = isHostMe();
  const pids = room.players.map(p => p.pid);
  const ranked = Engine.rank(pids, room.totals);
  const winners = ranked.filter(r => r.rank === 1).map(r => playerOf(room, r.pid).name);
  const podium = [ranked[1], ranked[0], ranked[2]];
  const award = (map) => {
    const best = Math.max(0, ...pids.map(pid => map[pid] || 0));
    if (!best) return null;
    return { names: pids.filter(pid => (map[pid] || 0) === best).map(pid => playerOf(room, pid)), n: best };
  };
  const uniq = award(room.uniques), stops = award(room.stops);
  const awardRow = (label, a, unit) => html`<div class="award line"><div class="label">${label}</div>
    ${a ? html`<div class="val">${a.names.map(p => html`<span style="display:inline-flex;align-items:center;gap:8px"><span class="dot" ${colorStyle(p.color)}></span>${p.name}</span>`)}</div><div class="small">${a.n} ${unit}</div>`
      : html`<div class="val muted">Kimse</div>`}</div>`;
  return html`<section class="view">
    <div class="head"><span class="kicker">${room.rounds.length} turluk maç bitti</span><h1 class="title-xl" tabindex="-1">${winners.length > 1 ? `Berabere: ${winners.join(', ')}` : `${winners[0]} kazandı.`}</h1></div>
    <section class="elite" aria-label="Kürsü" style="overflow:hidden;margin-bottom:clamp(28px,5vw,44px)"><div class="podium">${podium.map((r, i) => {

      const p = playerOf(room, r.pid);

    ${ranked.length > 3 ? html`<ol class="rest sheet" start="4" style="margin:-16px 0 32px">${ranked.slice(3).map(r => { const p = playerOf(room, r.pid); return html`<li><span style="display:flex;align-items:center;gap:10px"><span class="num muted">${r.rank}.</span><span class="dot" ${colorStyle(p.color)}></span><strong>${p.name}</strong></span><span class="num" style="font-weight:700">${r.total}</span></li>`; })}</ol>` : ''}
    <div class="split" style="margin-bottom:clamp(28px,5vw,44px)">
      <section class="block" aria-labelledby="aw-h"><div class="block-head"><h2 id="aw-h">Öne çıkanlar</h2></div>

      <section class="block" aria-labelledby="ch-h"><div class="block-head"><h2 id="ch-h">Toplam puan</h2></div>${totalsChart(room)}</section>
    </div>
    <section class="block" aria-labelledby="tb-h"><div class="block-head"><h2 id="tb-h">Tur tur puanlar</h2></div>
      <div class="table-wrap"><table class="data"><thead><tr><th scope="col">Tur</th>${ranked.map(r => { const p = playerOf(room, r.pid); return html`<th scope="col"><span class="th-player"><span class="dot" ${colorStyle(p.color)}></span>${p.name}</span></th>`; })}</tr></thead>
      <tbody>${room.rounds.map((rd, i) => html`<tr><td>${i + 1}. tur, ${rd.letter}${rd.stopBy ? html` <span class="hint">STOP: ${playerOf(room, rd.stopBy).name}</span>` : ''}</td>${ranked.map(r => html`<td>${rd.pts[r.pid] || 0}</td>`)}</tr>`)}</tbody>
      <tfoot><tr><td>Toplam</td>${ranked.map(r => html`<td>${r.total}</td>`)}</tr></tfoot></table></div></section>
    <div class="dock">${host ? html`<div class="btns"><button type="button" class="btn btn-primary btn-lg" data-action="rematch">Rövanş</button><button type="button" class="btn btn-lg" data-action="to-lobby">Lobiye dön</button></div>`

/* ---------- İstatistikler ---------- */
function viewStats() {
  const hist = History.list();
  const played = hist.length;
  const won = hist.filter(e => e.won).length;
  const total = hist.reduce((s, e) => s + e.myTotal, 0);
  const best = hist.reduce((m, e) => Math.max(m, e.myTotal), 0);
  const agg = {};
  for (const e of hist) for (const [name, v] of Object.entries(e.cats)) { const a = agg[name] = agg[name] || { pts: 0, n: 0 }; a.pts += v.pts; a.n += v.n; }
  const catList = Object.entries(agg).filter(([, v]) => v.n > 0).map(([name, v]) => ({ name, avg: v.pts / v.n, pts: v.pts, n: v.n })).sort((a, b) => b.avg - a.avg || b.pts - a.pts);
  const topCat = catList[0];
  const nf = (x) => x.toLocaleString('tr-TR', { maximumFractionDigits: 1 });
  return html`<section class="view">
    <div class="head"><h1 class="title-l" tabindex="-1">İstatistikler</h1><p class="lead">Bu cihazda bitirdiğin maçlardan hesaplanır.</p></div>
    <div class="split">
      <section class="block" aria-label="Özet"><ul class="stats sheet">
        <li class="stat"><div><div class="label">Oynanan maç</div></div><div class="val" data-count="${played}">${played}</div></li>
        <li class="stat"><div><div class="label">Kazanılan maç</div><div class="sub">${played ? `Maçların %${Math.round(won / played * 100)}'i` : 'Henüz yok'}</div></div><div class="val" data-count="${won}">${won}</div></li>
        <li class="stat"><div><div class="label">Toplam puan</div><div class="sub">${played ? `Maç başına ${nf(total / played)}, en iyi ${best}` : 'Henüz yok'}</div></div><div class="val" data-count="${total}">${total}</div></li>
        <li class="stat"><div><div class="label">En başarılı kategori</div><div class="sub">${topCat ? `Tur başına ${nf(topCat.avg)} puan` : 'Veri yok'}</div></div><div class="val txt">${topCat ? topCat.name : '—'}</div></li>
      </ul></section>
      ${catList.length ? html`<section class="block"><div class="block-head"><h2>Kategorilere göre</h2><span class="small">tur başına puan</span></div>
        <div class="score-table sheet">${catList.map(c => html`<div><span>${c.name} <span class="hint">${c.n} tur</span></span><b>${nf(c.avg)}</b></div>`)}</div></section>` : ''}
    </div>
    <section class="block" style="margin-top:clamp(28px,5vw,44px)"><div class="block-head"><h2>Maç geçmişi</h2></div>
      ${hist.length ? historyList(hist.slice(0, 20)) : html`<p class="empty sheet">İlk maçını bitirdiğinde burada görünür.</p>`}
      ${hist.length ? html`<div><button type="button" class="btn btn-danger btn-sm" data-action="clear-stats">İstatistikleri sıfırla</button></div>` : ''}</section>
  </section>`;
}

/* ---------- Ana yönlendirici ---------- */
function viewMasa() {
  const S = S_();
  if (!S) return null;
  if (S.status === 'failed' && S.role === 'host') return viewState({ type: 'failed', reason: S.statusInfo || 'network', code: S.code });
  if (!S.room || (S.role === 'host' && S.status !== 'open')) return viewConnecting(S);
  const room = S.room;
  switch (room.phase) {
    case 'lobby': return viewLobby(S, room);
    case 'reveal': return viewReveal(S, room);
    case 'playing': case 'collect': return viewRound(S, room);
    case 'review': return viewReview(S, room);
    case 'final': return viewFinal(S, room);
    default: return viewConnecting(S);
  }
}

function currentView() {
  switch (App.route.path) {
    case '': return viewHome();
    case 'profil': return viewProfile();
    case 'oda': return viewJoin();
    case 'nasil': return viewHowto();
    case 'istatistik': return viewStats();
    case 'yeniden': return viewReopen();
    case 'durum': return viewState(App.stateScreen);
    case 'masa': return viewMasa() || viewHome();
    default: return viewHome();
  }
}

let lastRouteKey = null;
function renderNow() {
  try {
    const main = document.getElementById('main');
    const routeKey = App.route.path + '?' + JSON.stringify(App.route.query);
    const routeChanged = routeKey !== lastRouteKey;
    lastRouteKey = routeKey;
    if (routeChanged) main.innerHTML = '';
    document.body.classList.toggle('in-room', inRoomRoute());
    Morph.apply(document.getElementById('topbar'), topbar().s);
    Morph.apply(document.getElementById('tabbar'), tabbar().s);
    Morph.apply(main, (currentView() || viewHome()).s);
    Morph.apply(document.getElementById('netband-root'), fmt(netband()));
    animateCounts(main);
    const S = S_();
    App.lastLocked = S && S.room ? isLocked(S.room) : null;
    if (routeChanged) { window.scrollTo(0, 0); App.focusNext = App.focusNext || 'heading'; }
    if (App.focusNext) {
      const kind = App.focusNext; App.focusNext = null;
      if (kind === 'answer') {
        const first = main.querySelector('[data-ans]:not([disabled])');
        if (first && !(document.activeElement && document.activeElement.hasAttribute('data-ans'))) first.focus({ preventScroll: true });
      } else if (!Modal.open) {
        const h = main.querySelector('h1[tabindex="-1"]');
        if (h && !(document.activeElement && main.contains(document.activeElement) && document.activeElement.matches('input'))) h.focus({ preventScroll: true });
      }
    }
  } catch (e) {
    console.error('[Ishan] Çizim hatası', e);
  }
}

/** 200 ms'lik arayüz döngüsü: sayaçları günceller, yerel kilidi denetler. */
function frame() {
  const S = S_();
  if (!S || !S.room || App.route.path !== 'masa') return;
  const room = S.room;
  if (room.phase === 'playing' || room.phase === 'collect') {
    const t = timerState(room);
    const val = document.querySelector('[data-timer-val]');
    if (val) {
      val.textContent = t.left == null ? '∞' : String(Math.ceil(t.left / 1000));
      val.parentElement.classList.toggle('urgent', t.kind === 'stop' || (t.left != null && t.left <= 10000));
    }
    const ring = document.querySelector('[data-ring]');
    if (ring && t.total) ring.setAttribute('stroke-dashoffset', (DIAL_C * (1 - Math.max(0, Math.min(1, t.left / t.total)))).toFixed(2));
    const sv = document.querySelector('[data-stop-val]');
    if (sv) sv.textContent = String(Math.ceil((Clock.left('stop') || 0) / 1000));
    const locked = isLocked(room);
    if (locked !== App.lastLocked) {
      if (locked && room.phase === 'playing') Mine.sendFinal();
      App.render();
    }
  }
}

function inviteUrl(code) {
  const keep = new URLSearchParams();
  try {
    const q = new URLSearchParams(location.search);
    for (const k of ['peer', 'peersecure', 'peerkey']) if (q.get(k)) keep.set(k, q.get(k));
  } catch (e) { /* yok say */ }
  const qs = keep.toString();
  return `${location.origin}${location.pathname}${qs ? '?' + qs : ''}#/oda?kod=${code}`;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e2) { return false; }
  }
}

function leaveConfirmText(S) {
  if (S.role === 'host') return { title: 'Oda kapatılsın mı?', body: 'Tüm oyuncuların bağlantısı kesilecek ve maç sona erecek.', confirmText: 'Odayı kapat', danger: true };
  const inMatch = S.room && S.room.phase !== 'lobby' && S.room.phase !== 'final';
  return { title: 'Odadan ayrılmak istiyor musun?', body: inMatch ? 'Maç sürüyor. Ayrılırsan bu maçta puan alamazsın.' : 'Odaya tekrar katılmak için kodu yeniden girmen gerekir.', confirmText: 'Ayrıl', danger: true };
}
/** Odayı kapatır (ev sahibi) veya odadan ayrılır (misafir). */
function endSession() {
  const S = S_();
  if (!S) return;
  try { if (S.role === 'host') S.close(); else S.leave(); } catch (e) { console.warn(e); }
  App.session = null;
  App.lastPhaseKey = null;
}
async function confirmLeave() {
  const S = S_();
  if (!S) return true;
  if (!S.isActiveRoom()) { endSession(); return true; }
  const ok = await Modal.confirm(Object.assign({ cancelText: 'Vazgeç' }, leaveConfirmText(S)));
  if (ok) endSession();
  return ok;
}

async function createRoom() {
  const pr = Profile.get();
  if (!pr.name) { App.afterProfile = { next: 'create' }; Toast.show('Önce ismini ve rengini seç.'); go('#/profil'); return; }
  const S = S_();
  if (S && S.isActiveRoom()) { go('#/masa'); return; }
  if (S) endSession();
  if (loadHostSnapshot()) {
    const ok = await Modal.confirm({ title: 'Yeni oda kurulsun mu?', body: 'Kapanan odanın kaydı silinecek ve o odaya dönülemeyecek.', confirmText: 'Yeni oda kur' });
    if (!ok) return;
    Store.remove(LS, 'ishan:hostroom');
  }
  App.session = createHostSession(Engine.makeCode(), pr, null);
  go('#/masa');
  App.session.open();
}
function joinRoom(code) {
  const S = S_();
  if (S) endSession();
  App.session = createGuestSession(code, Profile.get(), false);
  go('#/masa');
  App.session.open();
}
function reopenRoom() {
  const snap = loadHostSnapshot();
  if (!snap) { Toast.show('Kayıtlı oda bulunamadı.', 'err'); go('#/'); return; }
  if (S_()) endSession();
  App.session = createHostSession(snap.code, Profile.get(), snap);
  go('#/masa');
  App.session.open();
}

/** Lobi ayar eylemleri (yalnızca ev sahibi). */
const SettingsActions = {
  'set-rounds': (el) => S_().updateSettings(s => { s.rounds = parseInt(el.dataset.val, 10); }),
  'set-duration': (el) => S_().updateSettings(s => { s.duration = parseInt(el.dataset.val, 10); }),
  'toggle-cat': (el) => S_().updateSettings(s => {
    const id = el.dataset.id;
    if (s.catIds.includes(id)) {
      if (s.catIds.length <= CONFIG.MIN_CATS) { Toast.show(`En az ${CONFIG.MIN_CATS} kategori seçili olmalı.`, 'err'); return false; }
      s.catIds = s.catIds.filter(x => x !== id);
    } else {
      if (s.catIds.length >= CONFIG.MAX_CATS) { Toast.show(`En fazla ${CONFIG.MAX_CATS} kategori seçebilirsin.`, 'err'); return false; }
      s.catIds.push(id);
    }
  }),
  'remove-cat': (el) => S_().updateSettings(s => {
    const id = el.dataset.id;
    if (s.catIds.includes(id) && s.catIds.length <= CONFIG.MIN_CATS) { Toast.show(`En az ${CONFIG.MIN_CATS} kategori seçili kalmalı.`, 'err'); return false; }
    s.custom = s.custom.filter(c => c.id !== id);
    s.catIds = s.catIds.filter(x => x !== id);
  }),
  'toggle-letter': (el) => S_().updateSettings(s => {
    const l = el.dataset.l;
    if (!PLAYABLE_LETTERS.includes(l)) return false;
    if (s.letters.includes(l)) {
      if (s.letters.length <= 1) { Toast.show('Havuzda en az bir harf kalmalı.', 'err'); return false; }
      s.letters = s.letters.filter(x => x !== l);
    } else s.letters.push(l);
  }),
  'rare-letters': (el) => S_().updateSettings(s => {
    if (el.dataset.val === 'on') s.letters = [...new Set([...s.letters, ...RARE_LETTERS])];
    else { const rest = s.letters.filter(l => !RARE_LETTERS.includes(l)); if (!rest.length) return false; s.letters = rest; }
  }),
  'letters-reset': () => S_().updateSettings(s => { s.letters = DEFAULT_LETTERS.slice(); }),
};

const Actions = {
  'create-room': () => createRoom(),
  'reopen-room': () => reopenRoom(),
  'discard-room': async () => {
    const ok = await Modal.confirm({ title: 'Oda silinsin mi?', body: 'Kayıtlı oda silinecek. Misafirler bu odaya bağlanamayacak.', confirmText: 'Sil', danger: true });
    if (ok) { Store.remove(LS, 'ishan:hostroom'); Tab.clearSession(); go('#/'); }
  },
  'cancel-connect': () => { endSession(); go('#/'); },
  'retry': () => { const S = S_(); if (S) { S.closed = false; go('#/masa'); S.retry(); } else go('#/'); },
  'leave-room': async () => { if (await confirmLeave()) go('#/'); },
  'profile-color': (el) => { App.profileColor = clampInt(parseInt(el.dataset.c, 10), 0, 7, 0); App.render(); },
  'my-color': (el) => { const S = S_(); if (S && S.room && S.room.phase === 'lobby') S.setColor(clampInt(parseInt(el.dataset.c, 10), 0, 7, 0)); },
  'copy-code': async () => { const S = S_(); if (S) Toast.show((await copyText(S.code)) ? 'Oda kodu kopyalandı.' : 'Kopyalanamadı.', 'ok'); },
  'share-link': async () => {
    const S = S_();
    if (!S) return;
    const url = inviteUrl(S.code);
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (navigator.share && coarse) {
      try { await navigator.share({ title: 'Ishan', text: `İsim Şehir Hayvan odası: ${S.code}`, url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    Toast.show((await copyText(url)) ? 'Davet bağlantısı kopyalandı.' : 'Kopyalanamadı.', 'ok');
  },
  'start-match': () => { const S = S_(); if (isHostMe()) S.startMatch(); },
  'stop': () => {
    const S = S_();
    if (!S || !S.room) return;
    if (isLocked(S.room) || !Engine.canStop(S.room.settings.cats, Mine.a, S.room.letter)) return;
    clearTimeout(Mine.sendTimer);
    Mine.finalSent = true;
    S.stop(Mine.a);
  },
  'force-end': async () => {
    if (!isHostMe()) return;
    const ok = await Modal.confirm({ title: 'Tur bitirilsin mi?', body: 'Herkese 10 saniyelik geri sayım başlar, ardından cevaplar kilitlenir.', confirmText: 'Turu bitir' });
    if (ok) S_().forceEnd();
  },
  'vote': (el) => {
    const S = S_();
    if (!S || !S.room || !S.room.review) return;
    const cat = el.dataset.cat, pid = el.dataset.pid;
    const cell = S.room.review.rows[cat] && S.room.review.rows[cat][pid];
    if (!cell) return;
    S.vote(cat, pid, !cell.votes.includes(me()));
  },
  'override': (el) => { if (isHostMe()) S_().override(el.dataset.cat, el.dataset.pid, el.dataset.val); },
  'next-round': () => { if (isHostMe()) S_().nextRound(); },
  'rematch': () => { if (isHostMe()) S_().rematch(); },
  'to-lobby': () => { if (isHostMe()) S_().toLobby(); },
  'clear-stats': async () => {
    const ok = await Modal.confirm({ title: 'İstatistikler sıfırlansın mı?', body: 'Bu cihazdaki tüm maç geçmişi silinecek.', confirmText: 'Sıfırla', danger: true });
    if (ok) { History.clear(); Toast.show('İstatistikler sıfırlandı.', 'ok'); App.render(); }
  },
};

const Forms = {
  profile(form) {
    const input = form.querySelector('#pf-name');
    const err = form.querySelector('#pf-err');
    const name = cleanText(input.value, CONFIG.NAME_MAX);
    if (!name) { err.textContent = 'İsim boş olamaz.'; input.setAttribute('aria-invalid', 'true'); input.focus(); return; }
    const color = App.profileColor != null ? App.profileColor : Profile.get().color;
    Profile.set({ name, color });
    App.profileColor = null;
    Toast.show('Profil kaydedildi.', 'ok');
    const after = App.afterProfile;
    App.afterProfile = null;
    if (after && after.next === 'create') createRoom();
    else if (after && after.next === 'join') joinRoom(after.code);
    else go('#/');
  },
  join(form) {
    const codeEl = form.querySelector('#join-code');
    const err = form.querySelector('#join-err');
    const code = Engine.normalizeCode(codeEl.value);
    codeEl.value = code;
    if (!Engine.isValidCode(code)) {
      err.textContent = code.length !== CONFIG.CODE_LENGTH ? 'Kod 5 karakter olmalı.' : 'Kodda geçersiz karakter var (0, O, 1 ve I kullanılmaz).';
      codeEl.setAttribute('aria-invalid', 'true'); codeEl.focus(); return;
    }
    err.textContent = ''; codeEl.removeAttribute('aria-invalid');
    const nameEl = form.querySelector('#join-name');
    if (nameEl) {
      const name = cleanText(nameEl.value, CONFIG.NAME_MAX);
      if (!name) { form.querySelector('#join-name-err').textContent = 'İsim boş olamaz.'; nameEl.setAttribute('aria-invalid', 'true'); nameEl.focus(); return; }
      Profile.set({ name, color: App.profileColor != null ? App.profileColor : Profile.get().color });
      App.profileColor = null;
    }
    joinRoom(code);
  },
  'add-cat'(form) {
    const input = form.querySelector('#custom-cat');
    const name = cleanText(input.value, CONFIG.CUSTOM_CAT_MAX);
    if (!name) { input.focus(); return; }
    const S = S_();
    if (!isHostMe() || !S.room) return;
    const st = S.room.settings;
    const key = foldKey(name);
    if ([...CATEGORY_DEFS, ...st.custom].some(c => foldKey(c.name) === key)) { Toast.show('Bu kategori zaten var.', 'err'); return; }
    S.updateSettings(s => {
      if (s.custom.length >= CONFIG.CUSTOM_CAT_LIMIT) { Toast.show(`En fazla ${CONFIG.CUSTOM_CAT_LIMIT} özel kategori ekleyebilirsin.`, 'err'); return false; }
      const id = 'c-' + randId(6);
      s.custom.push({ id, name });
      if (s.catIds.length < CONFIG.MAX_CATS) s.catIds.push(id);
      else Toast.show('Kategori eklendi ama seçili sayısı dolu olduğu için kapalı.');
    });
    input.value = '';
  },
};

function bindEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    const name = el.getAttribute('data-action');
    const fn = Actions[name] || (SettingsActions[name] && isHostMe() ? SettingsActions[name] : null);
    if (!fn) return;
    e.preventDefault();
    try { const r = fn(el, e); if (r && r.catch) r.catch(err => console.error('[Ishan] Eylem hatası', name, err)); }
    catch (err) { console.error('[Ishan] Eylem hatası', name, err); Toast.show('Bir hata oluştu.', 'err'); }
  });

  document.addEventListener('submit', (e) => {
    const form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    const fn = Forms[form.getAttribute('data-form')];
    try { if (fn) fn(form); } catch (err) { console.error('[Ishan] Form hatası', err); }
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.matches('[data-ans]')) {
      const S = S_();
      if (!S || !S.room || isLocked(S.room)) return;
      Mine.set(el.getAttribute('data-ans'), el.value);
      App.render();
    } else if (el.id === 'join-code') {
      const pos = el.selectionStart;
      const v = Engine.normalizeCode(el.value);
      if (v !== el.value) { el.value = v; try { el.setSelectionRange(Math.min(pos, v.length), Math.min(pos, v.length)); } catch (e2) { /* yok say */ } }
      const err = document.getElementById('join-err');
      if (err) err.textContent = '';
      el.removeAttribute('aria-invalid');
    }
  });

  document.addEventListener('keydown', (e) => {
    const el = e.target;
    if (e.key === 'Enter' && el.matches && el.matches('[data-ans]')) {
      e.preventDefault();
      const all = Array.from(document.querySelectorAll('[data-ans]:not([disabled])'));
      const i = all.indexOf(el);
      if (i >= 0 && i < all.length - 1) all[i + 1].focus();
      else { const stop = document.querySelector('[data-action="stop"]:not([disabled])'); if (stop) stop.focus(); else el.blur(); }
      return;
    }
    // Renk seçicide ok tuşlarıyla gezinme (radiogroup).
    if (el.matches && el.matches('.swatch') && ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
      e.preventDefault();
      const list = Array.from(el.parentElement.querySelectorAll('.swatch:not([disabled])'));
      const i = list.indexOf(el);
      const next = list[(i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : list.length - 1)) % list.length];
      if (next) { next.focus(); next.click(); }
    }
  });

  // Grafik: imleç çizgisi ve araç ipucu.
  document.addEventListener('pointermove', (e) => {
    const hit = e.target.closest && e.target.closest('[data-chart-i]');
    const wrap = e.target.closest && e.target.closest('[data-chart]');
    if (!wrap) return;
    const tip = wrap.querySelector('[data-chart-tip]');
    const xh = wrap.querySelector('[data-xhair]');
    if (!hit || !App.chart) { tip.classList.remove('show'); xh.setAttribute('visibility', 'hidden'); return; }
    const i = parseInt(hit.getAttribute('data-chart-i'), 10);
    const rect = hit.getBBox();
    const cx = rect.x + rect.width / 2;
    xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
    const rows = App.chart.series.map(s => ({ s, v: s.vals[i] })).sort((a, b) => b.v - a.v);
    tip.innerHTML = html`<div class="tt">${i === 0 ? 'Başlangıç' : `Tur ${i} · ${App.chart.xLabels[i]}`}</div>${rows.map(r => html`<div class="tr"><span><span class="dot" ${colorStyle(r.s.color)}></span>${r.s.name}</span><strong class="num">${r.v}</strong></div>`)}`.s;
    const box = wrap.getBoundingClientRect();
    const px = e.clientX - box.left;
    const left = px > box.width / 2 ? px - tip.offsetWidth - 14 : px + 14;
    tip.style.left = Math.max(0, Math.min(box.width - tip.offsetWidth, left)) + 'px';
    tip.style.top = Math.max(0, e.clientY - box.top - 20) + 'px';
    tip.classList.add('show');
  });
  document.addEventListener('pointerleave', (e) => {
    if (e.target && e.target.matches && e.target.matches('[data-chart]')) {
      const tip = e.target.querySelector('[data-chart-tip]'); if (tip) tip.classList.remove('show');
      const xh = e.target.querySelector('[data-xhair]'); if (xh) xh.setAttribute('visibility', 'hidden');
    }
  }, true);

  window.addEventListener('hashchange', onHashChange);
  let resizeT = null;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => App.render(), 150); });

  // Ev sahibi oyuncuyken sekmeyi kapatmaya çalışırsa uyarı.
  window.addEventListener('beforeunload', (e) => {
    const S = S_();
    if (S && S.role === 'host' && S.isActiveRoom()) {
      S.persistNow();
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
    return undefined;
  });
  window.addEventListener('pagehide', () => { const S = S_(); if (S && S.role === 'host' && S.isActiveRoom()) S.persistNow(); });
  document.addEventListener('visibilitychange', () => { const S = S_(); if (document.hidden && S && S.role === 'host' && S.isActiveRoom()) S.persistNow(); });
}

let hashGuard = false;
async function onHashChange() {
  const next = parseHash();
  const S = S_();
  if (!hashGuard && S && S.isActiveRoom() && App.route.path === 'masa' && next.path !== 'masa') {
    // Odadan çıkmak üzere: önce onay al.
    const target = location.hash || '#/';
    hashGuard = true;
    history.replaceState(null, '', '#/masa');
    hashGuard = false;
    const ok = await confirmLeave();
    if (ok) { location.hash = target === '#/masa' ? '#/' : target; }
    return;
  }
  App.route = next;
  App.render();
}

/* =========================================================================
 * 14. BAŞLATMA
 * ========================================================================= */
/** Döndürülmüş elipslerden oluşan, tek seferlik üretilen statik gilyoş deseni. */
function guillocheSvg() {
  // Dalgalı eş merkezli halkalar: r(θ) = R + A·sin(nθ + φ(R)); faz kayması moire etkisi verir.
  const c = 400, n = 18, A = 9;
  let paths = '';
  for (let R = 30; R <= 390; R += 12) {
    let d = '';
    for (let k = 0; k <= 120; k++) {
      const t = (k / 120) * Math.PI * 2;
      const r = R + A * Math.sin(n * t + R * 0.045);
      d += `${k ? 'L' : 'M'}${(c + r * Math.cos(t)).toFixed(1)} ${(c + r * Math.sin(t)).toFixed(1)}`;
    }
    paths += `<path d="${d}Z"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><g fill="none" stroke="#f3f1ec" stroke-width=".8">${paths}</g></svg>`;
}
function boot() {
  try {
    // Logo: favicon, arka plan, açılış ekranı ve menüde aynı gömülü görsel.
    // Gilyoş deseni: saat kadranlarındaki ince oyma desen. Arka planda, mod kartlarında ve harf kadranında kullanılır.
    document.documentElement.style.setProperty('--guilloche', `url("data:image/svg+xml;utf8,${encodeURIComponent(guillocheSvg())}")`);
    const splashLogo = document.getElementById('splash-logo');
    if (splashLogo) splashLogo.src = LOGO_SRC;

    bindEvents();
    setInterval(frame, 200);

    App.route = parseHash();
    const sess = Tab.getSession();
    if (sess && sess.role === 'guest') {
      // Sayfa yenilendi: aynı oyuncu kimliğiyle otomatik yeniden bağlan.
      App.session = createGuestSession(sess.code, Profile.get().name ? Profile.get() : { name: 'Oyuncu', color: Profile.get().color }, true);
      if (App.route.path !== 'masa') history.replaceState(null, '', '#/masa');
      App.route = parseHash();
      App.session.open();
    } else if (sess && sess.role === 'host') {
      const snap = loadHostSnapshot();
      if (snap && snap.code === sess.code) { history.replaceState(null, '', '#/yeniden'); App.route = parseHash(); }
      else Tab.clearSession();
    } else if (App.route.path === 'masa' || App.route.path === 'durum') {
      history.replaceState(null, '', '#/');
      App.route = parseHash();
    }
    renderNow();
  } catch (e) {
    console.error('[Ishan] Başlatma hatası', e);
  }
  const splash = document.getElementById('splash');
  if (splash) setTimeout(() => { splash.classList.add('hide'); setTimeout(() => splash.remove(), 400); }, 650);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
