<style>
/* =========================================================
   TASARIM DİLİ: "Teneffüs"
   Kareli defter kâğıdı, mürekkep çizgiler, keçeli kalem
   vurguları ve sert ofset gölgeler. Cevaplar el yazısıyla
   yazılır; turun harfi bir jetonun üstünde durur.
   Koyu temada aynı defter bir kara tahtaya dönüşür.
   ========================================================= */
:root{
  --bg:#f4ecdc;
  --paper:#fffaf0;
  --paper-2:#f8efdd;
  --ink:#1c1a2e;
  --edge:#1c1a2e;          /* kenar çizgisi */
  --drop:#1c1a2e;          /* sert gölge */
  --muted:#5d586b;
  --faint:#958e9e;
  --ember:#ff5a36;         /* domates */
  --ember-2:#c8381a;       /* kâğıt üstünde okunur domates */
  --on-ember:#1c1a2e;
  --hi:#ffd23f;            /* fosforlu kalem */
  --hi-soft:#fff0b3;
  --mint:#9fe3c8;
  --ok:#14885d;
  --err:#d92f3a;
  --rule:rgba(28,26,46,.12);
  --rule-2:rgba(28,26,46,.22);
  --grid:rgba(52,92,170,.085);
  --margin:rgba(217,47,58,.42);
  --line:var(--edge);
  --line-2:var(--edge);
  --sh-1:2px 2px 0 var(--drop);
  --sh-2:4px 4px 0 var(--drop);
  --sh-3:7px 7px 0 var(--drop);
  --font-display:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --font-body:'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --font-hand:'Caveat', 'Segoe Print', 'Comic Sans MS', cursive;
  --ease-out:cubic-bezier(.16,.84,.24,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --tabbar-h:0px;
}
/* Kara tahta */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b2522;
    --paper:#24302c;
    --paper-2:#202b28;
    --ink:#f2efe4;
    --edge:rgba(242,239,228,.78);
    --drop:#0b100e;
    --muted:#aab5ae;
    --faint:#6f7c76;
    --ember:#ff6a45;
    --ember-2:#ff8f70;
    --on-ember:#1c1a2e;
    --hi:#ffd23f;
    --hi-soft:#4a4426;
    --mint:#2b5b4a;
    --ok:#4fd6a0;
    --err:#ff6b74;
    --rule:rgba(242,239,228,.09);
    --rule-2:rgba(242,239,228,.2);
    --grid:rgba(242,239,228,.045);
    --margin:rgba(255,107,116,.38);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.02;font-variation-settings:"opsz" 72}
p{margin:0}
button,input{font:inherit;color:inherit}
a{color:var(--ember-2);text-underline-offset:3px;text-decoration-thickness:2px}
img{max-width:100%}
strong{font-weight:800}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px;border-radius:10px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible,.line-input input:focus-visible,.input:focus-visible,.code-input:focus-visible{outline:none}
::selection{background:var(--hi);color:#1c1a2e}
.skip-link{position:fixed;left:12px;top:12px;z-index:100;background:var(--hi);color:#1c1a2e;padding:12px 16px;border-radius:12px;border:2px solid var(--edge);font-weight:800;text-decoration:none}
.skip-link:not(:focus){width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- Arka plan: kareli defter ---------- */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;background-position:-1px -1px}
.bg-horizon{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%, transparent 40%, var(--bg) 100%)}
.bg-rose{position:absolute;left:clamp(10px,3vw,34px);top:0;bottom:0;width:2px;background:var(--margin);opacity:.5;box-shadow:6px 0 0 var(--margin)}
@media (max-width:759px){.bg-rose{display:none}}

/* ---------- İskelet ---------- */
.app-shell{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-top)) clamp(14px,4vw,32px) 8px;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--edge)}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:48px;color:var(--ink);text-decoration:none;border-radius:12px;padding-right:4px}
.brand img{width:34px;height:34px;display:block;transform:rotate(-6deg);transition:transform .3s var(--ease-spring)}
.brand:hover img{transform:rotate(6deg) scale(1.06)}
.brand span{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:-.04em}
.topnav{margin-left:auto;display:flex;align-items:center;gap:6px}
.topnav a,.topnav button{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:999px;border:2px solid transparent;background:none;color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color .15s, border-color .15s, transform .15s var(--ease-spring)}
.topnav a:hover,.topnav button:hover{border-color:var(--edge)}
.topnav a[aria-current="page"]{background:var(--hi);color:#1c1a2e;border-color:var(--edge);box-shadow:var(--sh-1)}
.topnav .me-link .dot{width:12px;height:12px}
.room-code{font-family:var(--font-display);font-weight:800;letter-spacing:.16em;font-size:16px;color:#1c1a2e;background:var(--hi);padding:6px 10px 6px 14px;border:2px solid var(--edge);border-radius:10px;box-shadow:var(--sh-1);transform:rotate(-2deg)}
.brand,.room-code{flex:0 0 auto}
@media (max-width:440px){
  body.in-room .brand span{display:none}
  .room-code{font-size:14px;letter-spacing:.12em;padding:4px 8px 4px 11px}
  .topnav a,.topnav button{padding:0 10px}
}
.leave-btn{color:var(--err)!important}
.leave-btn:hover{border-color:var(--err)!important}
main{flex:1;width:100%;max-width:1060px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(16px,4vw,32px) calc(56px + var(--tabbar-h) + var(--safe-bottom)) clamp(16px,6vw,64px)}
.view{animation:viewIn .32s var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Mobil alt sekme çubuğu */
.tabbar{display:none}
@media (max-width:759px){
  :root{--tabbar-h:72px}
  body.in-room{--tabbar-h:0px}
  .topnav .desk{display:none}
  .tabbar{position:fixed;left:10px;right:10px;bottom:calc(8px + var(--safe-bottom));z-index:30;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px;background:var(--paper);border:2px solid var(--edge);border-radius:20px;box-shadow:var(--sh-2)}
  body.in-room .tabbar{display:none}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:800;transition:background-color .15s}
  .tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease-spring)}
  .tabbar a[aria-current="page"]{color:#1c1a2e;background:var(--hi)}
  .tabbar a[aria-current="page"] svg{transform:translateY(-1px) rotate(-6deg) scale(1.08)}
  main{padding-left:16px}
}

/* ---------- Yazı ölçeği ---------- */
.title-xl{font-size:clamp(42px,11vw,76px);letter-spacing:-.045em}
.title-l{font-size:clamp(32px,7.6vw,48px);letter-spacing:-.04em}
.title-m{font-size:clamp(22px,5vw,28px)}
.title-xl,.title-l{text-decoration:underline;text-decoration-color:var(--hi);text-decoration-thickness:.3em;text-underline-offset:-.14em;text-decoration-skip-ink:none}
.lead{color:var(--muted);font-size:17.5px;max-width:56ch}
.small{font-size:13.5px;color:var(--muted)}
.head{display:flex;flex-direction:column;gap:12px;margin-bottom:clamp(22px,4vw,34px)}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.kicker{font-family:var(--font-hand);font-weight:700;font-size:24px;line-height:1;color:var(--ember-2);transform:rotate(-2deg);transform-origin:left;display:inline-block}

/* ---------- Yüzeyler ---------- */
.elite{position:relative;border:2px solid var(--edge);border-radius:20px;background:var(--paper);box-shadow:var(--sh-3);min-width:0}
.elite::before{display:none}
/* Cevap kâğıdı: defter satırları ve kırmızı kenar çizgisi. */
.sheet{position:relative;padding-left:24px;min-width:0}
.sheet::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--margin)}
.sheet > .line,.sheet > li{border-bottom:1.5px dashed var(--rule-2)}
.sheet > .line:last-child,.sheet > li:last-child{border-bottom:0}
.panel{border-radius:20px;background:var(--paper);border:2px solid var(--edge);padding:clamp(18px,3.5vw,28px);min-width:0}
.block{display:flex;flex-direction:column;gap:14px;min-width:0}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.block-head h2{font-size:24px}
.block-head a{font-weight:800;font-size:14.5px;min-height:44px;display:inline-flex;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(28px,4vw,44px)}
@media (min-width:860px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* ---------- Butonlar ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;border:2px solid var(--edge);background:var(--paper);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:16.5px;letter-spacing:-.01em;cursor:pointer;text-decoration:none;white-space:nowrap;user-select:none;-webkit-user-select:none;box-shadow:var(--sh-2);transition:transform .12s ease, box-shadow .12s ease, background-color .15s, opacity .15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--drop)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--drop)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;border-style:dashed}
.btn-primary{background:var(--ember);color:var(--on-ember)}
.btn-primary:hover{background:color-mix(in srgb, var(--ember) 88%, #fff)}
.btn-primary[disabled]{background:var(--paper-2);color:var(--muted);opacity:1}
.btn-danger{background:transparent;color:var(--err);border-color:var(--err);box-shadow:2px 2px 0 var(--err)}
.btn-danger:hover{background:color-mix(in srgb, var(--err) 10%, transparent);box-shadow:4px 4px 0 var(--err)}
.btn-danger:active{box-shadow:0 0 0 var(--err)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--rule-2)}
.btn-quiet:hover{color:var(--ink);box-shadow:none;text-decoration-color:var(--ember)}
.btn-quiet:active{box-shadow:none}
.btn-lg{min-height:60px;font-size:19px;padding:0 28px;border-radius:16px}
.btn-sm{min-height:46px;font-size:14.5px;padding:0 14px;box-shadow:var(--sh-1)}
.btn-sm:hover{box-shadow:3px 3px 0 var(--drop)}
.btn-block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btns > .btn{flex:1 1 auto}

/* Alt eylem yuvası */
.dock{position:sticky;bottom:calc(var(--tabbar-h) + 12px + var(--safe-bottom));z-index:12;margin-top:28px;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:22px;background:var(--paper);border:2px solid var(--edge);box-shadow:var(--sh-3)}
.dock-row{display:flex;align-items:center;gap:12px}
.dock .note{font-size:13.5px;color:var(--muted);text-align:center}
.waiting{display:flex;align-items:center;justify-content:center;gap:12px;min-height:50px;color:var(--muted);font-weight:700;font-size:15px;text-align:center}
.waiting i{flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:var(--ember);border:2px solid var(--edge);animation:hop 1.1s var(--ease-spring) infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}

/* ---------- Form ---------- */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font-family:var(--font-display);font-weight:700;font-size:15px}
.hint{font-size:13px;color:var(--muted)}
.field-error{color:var(--err);font-size:13.5px;font-weight:800}
.field-error:empty{display:none}
.input{width:100%;min-height:54px;padding:12px 16px;border-radius:14px;border:2px solid var(--edge);background:var(--paper-2);color:var(--ink);font-size:17px;font-weight:600;transition:box-shadow .15s, background-color .15s}
.input::placeholder{color:var(--faint);font-weight:500}
.input:focus{background:var(--paper);box-shadow:4px 4px 0 var(--ember)}
.input[aria-invalid="true"]{border-color:var(--err);box-shadow:4px 4px 0 var(--err)}
.code-input{width:100%;min-height:84px;border-radius:18px;border:2px solid var(--edge);background:var(--paper-2);color:var(--ink);text-align:center;font-family:var(--font-display);font-weight:800;font-size:clamp(32px,9vw,44px);letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;transition:box-shadow .15s, background-color .15s}
.code-input:focus{background:var(--paper);box-shadow:5px 5px 0 var(--ember)}
.code-input::placeholder{color:var(--faint)}
.code-input[aria-invalid="true"]{border-color:var(--err);box-shadow:5px 5px 0 var(--err)}

.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatch{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--edge);background:var(--sw);cursor:pointer;box-shadow:var(--sh-1);transition:transform .22s var(--ease-spring)}
.swatch::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2.5px dashed var(--ink);opacity:0;transform:scale(.8) rotate(-40deg);transition:opacity .18s, transform .3s var(--ease-spring)}
.swatch[aria-checked="true"]{transform:scale(1.04)}
.swatch[aria-checked="true"]::after{opacity:1;transform:none;animation:spin 9s linear infinite}
.swatch:hover{transform:scale(1.1) rotate(-6deg)}
.swatch[disabled]{opacity:.25;cursor:not-allowed;transform:none;box-shadow:none}
.swatch[disabled]::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:2.5px;background:var(--ink);transform:rotate(-45deg)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 15px;border-radius:999px;border:2px solid var(--rule-2);background:transparent;color:var(--muted);font-weight:700;font-size:15px;cursor:pointer;transition:color .15s, background-color .15s, border-color .15s, transform .2s var(--ease-spring), box-shadow .15s}
.chip:hover{border-color:var(--edge);color:var(--ink)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{color:#1c1a2e;border-color:var(--edge);background:var(--hi);box-shadow:var(--sh-1)}
.chip[aria-disabled="true"]{cursor:default}
.chip[aria-disabled="true"]:hover{border-color:var(--rule-2);color:var(--muted)}
.chip[aria-disabled="true"][aria-pressed="true"]:hover{border-color:var(--edge);color:#1c1a2e}
.chip[aria-disabled="true"]:active{transform:none}
.chip .x{font-size:18px;line-height:1;color:var(--err);font-weight:800}
.chip.letter{min-width:46px;justify-content:center;padding:0 8px;border-radius:10px;font-family:var(--font-display);font-weight:800;font-size:18px}
.chip.letter[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.chip.letter[aria-pressed="true"]:nth-child(3n){transform:rotate(-3deg)}
.chip.letter[aria-pressed="true"]:nth-child(3n+1){transform:rotate(2deg)}
.chip.letter.rare{border-style:dashed}
.chip.letter.rare[aria-pressed="true"]{background:var(--hi-soft)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;border-radius:14px;border:2px solid var(--edge);overflow:hidden;background:var(--paper)}
.seg button{min-height:48px;border:0;border-left:2px solid var(--edge);background:transparent;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer;transition:color .15s, background-color .15s}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--paper-2)}
.seg button[aria-pressed="true"]{color:var(--on-ember);background:var(--ember)}
.seg button[aria-disabled="true"]{cursor:default;color:var(--muted)}
.seg button[aria-disabled="true"]:hover{background:transparent}
.seg button[aria-disabled="true"][aria-pressed="true"]{color:#1c1a2e;background:var(--hi)}

.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--pc,#888);flex:0 0 auto;border:2px solid var(--edge)}
.dot.lg{width:20px;height:20px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:6px;font-family:var(--font-display);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.6;color:var(--muted);border:2px solid currentColor;white-space:nowrap;transform:rotate(-1.5deg)}
.tag:nth-child(even){transform:rotate(1.5deg)}
.tag.ember{color:var(--ember-2)}
.tag.ok{color:var(--ok)}
.tag.err{color:var(--err)}
.tag.warn{color:#a86d00}
@media (prefers-color-scheme: dark){.tag.warn{color:var(--hi)}}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ok);white-space:nowrap}
.conn::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}
.conn.off{color:var(--err)}
.conn.off::before{background:var(--err);animation:breathe 1.2s ease-in-out infinite}

/* ---------- Ana sayfa ---------- */
.hero{display:flex;flex-direction:column;gap:16px;margin-bottom:clamp(28px,5vw,48px)}
.hero .who{display:inline-flex;align-items:center;flex-wrap:wrap;gap:10px;color:var(--muted);font-weight:600;font-size:16.5px}
.hero .who a{font-weight:800}
.sheet-head{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sheet-head span{position:relative;padding:4px 14px 6px;font-family:var(--font-hand);font-weight:700;font-size:clamp(22px,5vw,27px);line-height:1.1;color:var(--ink);background:var(--paper);border:2px solid var(--edge);border-radius:12px;box-shadow:var(--sh-1);white-space:nowrap;animation:drop .5s var(--ease-spring) both;animation-delay:calc(var(--i) * 70ms + 120ms);transform:rotate(calc((var(--i) - 2.5) * 1.4deg))}
.sheet-head span:first-child{background:var(--ember);color:#1c1a2e}
.sheet-head span:nth-child(3){background:var(--hi);color:#1c1a2e}
.sheet-head span:nth-child(5){background:var(--mint)}
@keyframes drop{from{opacity:0;transform:translateY(-14px) rotate(-12deg)}}
@keyframes drawX{from{transform:scaleX(0)}to{transform:none}}
@keyframes drawY{from{transform:scaleY(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modes{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-bottom:clamp(34px,6vw,58px)}
@media (min-width:700px){.modes{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}}
.mode-card{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:190px;padding:30px 26px 26px;text-align:left;color:#1c1a2e;text-decoration:none;cursor:pointer;width:100%;overflow:visible;font:inherit;transition:transform .25s var(--ease-spring), box-shadow .2s ease}
.mode-card:nth-child(1){background:var(--ember);transform:rotate(-1deg)}
.mode-card:nth-child(2){background:var(--hi);transform:rotate(.8deg)}
.mode-card::before{display:block;content:"";position:absolute;top:-13px;left:50%;width:96px;height:26px;margin-left:-48px;background:rgba(255,255,255,.55);border:1px solid rgba(28,26,46,.15);transform:rotate(-4deg);pointer-events:none}
.mode-card:nth-child(2)::before{transform:rotate(5deg);left:30%}
.mode-card::after{content:"→";position:absolute;right:22px;top:18px;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:var(--paper);color:var(--ink);border:2px solid #1c1a2e;font-family:var(--font-display);font-weight:800;font-size:22px;transition:transform .3s var(--ease-spring)}
.mode-card:hover::after{transform:translateX(4px) rotate(-12deg)}
.mode-card h2,.mode-card p{position:relative}
.mode-card h2{color:#1c1a2e;font-size:clamp(34px,8vw,44px);letter-spacing:-.045em}
.mode-card p{color:rgba(28,26,46,.78);font-size:16px;font-weight:600;max-width:34ch}
.mode-card:hover{transform:rotate(0) translate(-2px,-3px);box-shadow:10px 10px 0 var(--drop)}
.mode-card:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--drop)}
@media (prefers-color-scheme: dark){.mode-card{border-color:#0b100e}}
.notice{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 16px 14px 18px;margin-bottom:24px;border-radius:16px;border:2px solid var(--edge);background:var(--hi-soft);box-shadow:var(--sh-2)}
.notice strong .num{color:var(--ember-2);letter-spacing:.14em}
.history{list-style:none;margin:0;padding:0 0 0 24px}
.history li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;min-height:66px;padding:10px 0}
.history .t{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history .rank{display:flex;align-items:baseline;gap:8px;justify-content:flex-end}
.history .rank .num{font-size:28px;font-weight:800}
.history .won .num{color:var(--ember-2)}
.history .won::before{content:"★";align-self:center;color:var(--hi);-webkit-text-stroke:1.5px var(--edge);font-size:20px}
.empty{padding:18px 0 18px 24px;color:var(--muted);font-family:var(--font-hand);font-size:24px;line-height:1.2}

/* ---------- Oda kodu karoları (harf taşları) ---------- */
.code-boxes{display:flex;gap:clamp(6px,2vw,12px)}
.code-box{width:clamp(48px,14vw,72px);aspect-ratio:1;display:grid;place-items:center;border-radius:14px;font-family:var(--font-display);font-weight:800;font-size:clamp(28px,8.6vw,44px);color:#1c1a2e;background:var(--hi-soft);border:2px solid var(--edge);box-shadow:var(--sh-2);animation:tileIn .55s var(--ease-spring) both;animation-delay:calc(var(--i) * 70ms);transform:rotate(var(--r,0deg))}
@media (prefers-color-scheme: dark){.code-box{background:var(--hi);border-color:#0b100e}}
.code-box:nth-child(odd){--r:-3deg}
.code-box:nth-child(even){--r:2.5deg}
.code-box:nth-child(3){--r:0deg;background:var(--ember)}
@keyframes tileIn{from{opacity:0;transform:translateY(-30px) rotate(-25deg)}to{opacity:1;transform:rotate(var(--r,0deg))}}

/* ---------- Oyuncular ---------- */
.players{list-style:none;margin:0}
.player{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0}
.player .name{flex:1;min-width:0;font-weight:800;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player.enter{animation:rise .35s var(--ease-out) both}

/* Ayar satırları */
.setting{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:18px 0}
.setting .sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* ---------- HARF JETONU (imza öğe) ---------- */
.dial{position:relative;width:var(--d,150px);aspect-ratio:1;flex:0 0 auto;display:grid;place-items:center}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.dial .track{stroke:var(--rule-2);stroke-dasharray:1.2 3.2}
.dial .bar{stroke:var(--ember);transition:stroke .2s}
.dial.stop .bar{stroke:var(--err)}
.dial.idle .bar{stroke:var(--hi)}
.dial .face{position:absolute;inset:12%;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--paper);border:3px solid var(--edge);box-shadow:5px 6px 0 var(--drop)}
.dial .face::before{content:"";position:absolute;inset:7%;border-radius:50%;border:2px dashed var(--rule-2)}
.dial .glyph{position:relative;font-family:var(--font-display);font-weight:800;font-size:calc(var(--d,150px) * .42);line-height:1;color:var(--ember);letter-spacing:-.04em;text-shadow:calc(var(--d,150px) * .018) calc(var(--d,150px) * .022) 0 var(--edge);transform:rotate(-5deg)}
.dial.stop .face{background:var(--err)}
.dial.stop .glyph{color:#fffaf0;text-shadow:calc(var(--d,150px) * .018) calc(var(--d,150px) * .022) 0 #1c1a2e}
.reel-window{position:absolute;inset:12%;border-radius:50%;overflow:hidden;display:block}
.reel{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;will-change:transform}
.reel span{display:grid;place-items:center;height:var(--cell);font-family:var(--font-display);font-weight:800;font-size:calc(var(--d,150px) * .42);line-height:1;color:var(--ember);letter-spacing:-.04em;text-shadow:calc(var(--d,150px) * .018) calc(var(--d,150px) * .022) 0 var(--edge)}
.reel span:not(:last-child){color:var(--faint);text-shadow:none}
.reel-window::before,.reel-window::after{content:"";position:absolute;left:0;right:0;height:30%;z-index:1;pointer-events:none}
.reel-window::before{top:0;background:linear-gradient(180deg,var(--paper),transparent)}
.reel-window::after{bottom:0;background:linear-gradient(0deg,var(--paper),transparent)}
.landed .face{animation:land .6s var(--ease-spring)}
.landed .face{background:var(--hi)}
.landed .reel span:last-child{color:var(--ember)}
@keyframes land{0%{transform:scale(.85) rotate(-10deg)}100%{transform:none}}

/* Çark ekranı */
.reveal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:min(70vh,620px);text-align:center}
.reveal .dial{--d:clamp(210px,60vw,300px)}
.reveal .kicker{font-size:30px;transform:rotate(-3deg);transform-origin:center}
.reveal .cats{color:var(--muted);max-width:40ch;font-family:var(--font-hand);font-size:24px;line-height:1.2}
.reveal .title-l{text-decoration:none}

/* ---------- Tur ekranı ---------- */
.round{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:900px){.round{grid-template-columns:300px minmax(0,1fr);gap:44px;align-items:start}.round-aside{position:sticky;top:96px}}
.round-aside{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:899px){.round-aside{display:contents}.round-top{order:1}.round-main{order:2}.round-others{order:3}}
.round-top{display:flex;align-items:center;gap:18px}
.round-top .dial{--d:clamp(120px,34vw,150px)}
@media (min-width:900px){.round-top{flex-direction:column;align-items:flex-start}.round-top .dial{--d:230px}}
.round-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.round-meta .secs{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,10vw,54px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.round-meta .secs small{font-family:var(--font-hand);font-size:24px;color:var(--muted);font-weight:700;margin-left:6px;letter-spacing:0}
.round-meta .secs.urgent{color:var(--err);animation:shake .5s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.alert{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-radius:18px;border:2px solid var(--edge);background:var(--err);color:#fffaf0;box-shadow:var(--sh-3);animation:alertIn .45s var(--ease-spring) both}
.alert .small{color:rgba(255,250,240,.88)}
.alert strong{font-family:var(--font-display);font-size:21px;display:block;letter-spacing:-.02em}
.alert .cd{font-family:var(--font-display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.alert.calm{background:var(--hi-soft);color:var(--ink);box-shadow:var(--sh-2)}
.alert.calm .small{color:var(--muted)}
@keyframes alertIn{from{opacity:0;transform:translateY(-12px) rotate(-3deg) scale(.96)}to{opacity:1;transform:none}}
.answer-sheet{background:var(--paper);border:2px solid var(--edge);border-radius:20px;box-shadow:var(--sh-3);padding:10px 20px 10px 46px}
.answer-sheet::before{left:30px;top:0;bottom:0}
.answer-sheet .line{display:grid;grid-template-columns:minmax(0,1fr);gap:0;padding:10px 0 6px}
@media (min-width:600px){.answer-sheet .line{grid-template-columns:120px minmax(0,1fr);align-items:center;gap:16px}}
.answer-sheet label{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);transition:color .15s}
@media (max-width:599px){.answer-sheet{padding:8px 14px 8px 34px}.answer-sheet::before{left:20px}.answer-sheet label{margin-bottom:-6px;position:relative;z-index:1}}
.answer-sheet .line:focus-within label{color:var(--ember-2)}
.line-input{display:flex;align-items:center;gap:10px;border-bottom:2.5px solid transparent;transition:border-color .2s}
.line-input:focus-within{border-color:var(--ember)}
.line-input.good{border-color:var(--ok)}
.line-input.bad{border-color:var(--err)}
.line-input .mark{flex:0 0 auto;width:30px;font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--ember);text-align:center}
.line-input input{flex:1;min-width:0;min-height:50px;padding:6px 0 2px;border:0;background:transparent;color:var(--ink);font-family:var(--font-hand);font-size:30px;font-weight:700;line-height:1}
.line-input input::placeholder{color:var(--faint);font-weight:500;font-size:22px}
.line-input input:disabled{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
.line-input .state{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;border:2px solid var(--edge);opacity:0;transform:scale(.4) rotate(-40deg);transition:opacity .18s, transform .3s var(--ease-spring)}
.line-input.good .state{opacity:1;transform:none;color:#fffaf0;background:var(--ok)}
.line-input.bad .state{opacity:1;transform:none;color:#fffaf0;background:var(--err)}
.meter{position:relative;height:14px;border-radius:999px;background:var(--paper-2);border:2px solid var(--edge);overflow:hidden;flex:1}
.meter > span{position:absolute;inset:0;background:repeating-linear-gradient(-45deg, var(--ember) 0 8px, color-mix(in srgb, var(--ember) 75%, #fff) 8px 16px);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .4s var(--ease-spring)}
.btn-stop{min-height:62px;font-size:26px;font-weight:800;letter-spacing:.08em;flex:1}
.btn-stop:not([disabled]){animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,82%,100%{rotate:0deg}86%{rotate:-2deg}90%{rotate:2deg}94%{rotate:-1deg}}
@media (max-width:599px){.round .dock{gap:8px;padding:10px}.round .dock .note{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}}
@media (pointer:coarse){.round-main:has(.answer-sheet input:focus) .dock{position:static}}
.round-others h2{font-family:var(--font-display)!important;font-size:15px}
.others{list-style:none;margin:0}
.other{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:48px;padding:6px 0;font-size:14.5px}
.other .name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.other .fill{display:flex;align-items:center;gap:10px}
.other .mini{width:56px;height:10px;border-radius:999px;background:var(--paper-2);border:1.5px solid var(--edge);overflow:hidden;position:relative}
.other .mini > span{position:absolute;inset:0;background:var(--pc);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .35s var(--ease-out)}
.other .num{color:var(--muted);font-size:14px}
.other .num b{color:var(--ink)}

/* ---------- Değerlendirme ---------- */
.review-head{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.review-head .dial{--d:104px}
.review-head .head{min-width:0}
@media (max-width:440px){.review-head{gap:14px}.review-head .dial{--d:78px}.review-head .title-l{font-size:30px}}
h1,h2{overflow-wrap:anywhere}
.cat{margin-bottom:34px}
.cat-title{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.cat-title h2{font-size:26px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--ember);text-decoration-thickness:.18em;text-underline-offset:.08em;text-decoration-skip-ink:none}
.ans-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 0;align-items:center}
.ans-row .who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--muted);min-width:0}
.ans-row .who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ans-row .text{grid-column:1;font-family:var(--font-hand);font-size:30px;font-weight:700;word-break:break-word;line-height:1.05}
.ans-row .text.blank{color:var(--faint);font-size:22px;font-weight:500}
.ans-row.invalid .text:not(.blank){color:var(--muted);text-decoration:line-through;text-decoration-color:var(--err);text-decoration-thickness:3px}
.ans-row .pts{grid-column:2;grid-row:1 / span 2;justify-self:end;display:grid;place-items:center;min-width:58px;height:58px;padding:0 6px;border-radius:50%;border:2.5px solid var(--ok);color:var(--ok);font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;transform:rotate(-8deg);animation:stamp .4s var(--ease-spring) both}
.ans-row .pts.zero{color:var(--faint);border-color:var(--rule-2);border-style:dashed}
.ans-row .flags,.ans-row .acts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px}
.ans-row .acts{margin-top:4px;align-items:center}
.stamp{animation:stamp .38s var(--ease-spring) both}
@keyframes stamp{0%{opacity:0;scale:1.6}100%{opacity:1;scale:1}}
.btn.vote{flex:0 1 auto}
.btn.vote[aria-pressed="true"]{background:var(--err);color:#fffaf0}
.judge{display:inline-grid;grid-auto-flow:column;gap:0;border-radius:12px;border:2px solid var(--edge);overflow:hidden;background:var(--paper)}
.judge button{min-height:42px;min-width:64px;padding:0 10px;border:0;border-left:2px solid var(--edge);background:transparent;color:var(--muted);font-family:var(--font-display);font-weight:700;font-size:13.5px;cursor:pointer}
.judge button:first-child{border-left:0}
.judge button[aria-pressed="true"].ov-auto{background:var(--hi);color:#1c1a2e}
.judge button[aria-pressed="true"].ov-valid{background:var(--ok);color:#fffaf0}
.judge button[aria-pressed="true"].ov-invalid{background:var(--err);color:#fffaf0}
@media (min-width:760px){
  .ans-row{grid-template-columns:140px minmax(0,1fr) auto auto;gap:6px 16px}
  .ans-row .who{grid-column:1}
  .ans-row .text{grid-column:2;grid-row:1}
  .ans-row .pts{grid-column:4;grid-row:1 / span 2}
  .ans-row .flags{grid-column:2 / 4;grid-row:2}
  .ans-row .acts{grid-column:3;grid-row:1;margin:0;justify-content:flex-end}
}

/* Tur puanları */
.standings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stand{position:relative;display:grid;grid-template-columns:2.2ch minmax(0,1fr) auto;align-items:center;gap:14px;min-height:66px;padding:10px 18px;border-radius:16px;border:2px solid var(--edge);background:var(--paper);box-shadow:var(--sh-1)}
.stand .rank{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--faint);text-align:center}
.stand .who strong{display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stand .who .sub{font-family:var(--font-hand);font-size:20px;line-height:1;color:var(--muted)}
.stand .big{font-family:var(--font-display);font-weight:800;font-size:32px;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.stand.winner{background:var(--hi);color:#1c1a2e;box-shadow:var(--sh-3);margin:16px 0 6px;transform:rotate(-.6deg)}
.stand.winner .rank,.stand.winner .who .sub{color:#1c1a2e}
@media (prefers-color-scheme: dark){.stand.winner{border-color:#0b100e}}
.win-tag{position:absolute;top:-15px;right:18px;padding:3px 12px;border-radius:8px;background:var(--ember);color:#1c1a2e;border:2px solid #1c1a2e;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-family:var(--font-display);transform:rotate(3deg);animation:stamp .45s var(--ease-spring) both}

/* ---------- Maç sonu ---------- */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,16px);align-items:end;padding:34px clamp(14px,3vw,28px) 0;margin-bottom:0;background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);background-size:20px 20px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .pname{display:flex;align-items:center;gap:7px;max-width:100%;font-weight:800;font-size:16.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pod .ppts{font-family:var(--font-hand);font-weight:700;color:var(--muted);font-size:22px;line-height:1}
.pod .block{width:100%;display:grid;place-items:start center;padding-top:14px;border-radius:14px 14px 0 0;font-family:var(--font-display);font-weight:800;font-size:44px;color:#1c1a2e;background:var(--paper-2);border:2px solid var(--edge);border-bottom:0;transform-origin:bottom;animation:grow .8s var(--ease-spring) both}
.pod.p1 .block{height:160px;background:var(--ember);animation-delay:.3s;font-size:56px}
.pod.p2 .block{height:116px;background:var(--hi);animation-delay:.1s}
.pod.p3 .block{height:86px;background:var(--mint);animation-delay:.2s}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:2px solid var(--edge);border-radius:16px;background:var(--paper);box-shadow:var(--sh-2)}

table.data th:first-child,table.data td:first-child{text-align:left;position:sticky;left:0;background:var(--paper);border-right:2px solid var(--margin)}
table.data thead th{font-family:var(--font-display);font-size:13.5px;font-weight:800;color:var(--ink);background:var(--paper-2)}
table.data tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--paper-2) 60%, var(--paper))}
table.data tfoot td{font-family:var(--font-display);font-weight:800;font-size:19px;border-bottom:0;border-top:2px solid var(--edge);background:var(--hi-soft)}

.th-player{display:inline-flex;align-items:center;gap:6px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.chart-wrap{position:relative;padding:16px;border:2px solid var(--edge);border-radius:16px;background:var(--paper);box-shadow:var(--sh-2)}

.chart-wrap .gridline{stroke:var(--rule-2);stroke-dasharray:3 4}
.chart-wrap .axis-label{fill:var(--muted);font-size:12px;font-weight:700;font-family:var(--font-display)}
.chart-wrap .series{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart-wrap circle{stroke:var(--paper)}
.chart-wrap svg > text:not(.axis-label){fill:var(--ink);font-family:var(--font-display)}
.chart-wrap .hit{fill:transparent;cursor:crosshair}
.chart-wrap .xhair{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.chart-tip{position:absolute;pointer-events:none;min-width:160px;padding:10px 12px;border-radius:14px;background:var(--paper);border:2px solid var(--edge);box-shadow:var(--sh-2);font-size:13.5px;opacity:0;transform:translateY(4px) rotate(-1deg);transition:opacity .12s, transform .15s var(--ease-spring);z-index:2}

.chart-tip .tt{font-family:var(--font-display);font-weight:800;margin-bottom:6px}
.chart-tip .tr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chart-tip .tr span:first-child{display:flex;align-items:center;gap:6px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--muted)}

.toast.err::before{background:var(--err)}
.toast.out{animation:toastOut .2s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) rotate(-2deg) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:scale(.95)}}
.modal-back{position:fixed;inset:0;z-index:80;display:grid;place-items:end center;padding:14px;background:rgba(20,18,32,.55);animation:fade .2s ease both}

.modal .btn-row .btn{flex:1}

.splash.hide{opacity:0;pointer-events:none}

/* =========================================================================
 * 3. METİN YARDIMCILARI (tr-TR kuralları)
 * ========================================================================= */
const trUpper = (s) => String(s).toLocaleUpperCase('tr-TR');
const trLower = (s) => String(s).toLocaleLowerCase('tr-TR');
const CONTROL_RE = /[\p{Cc}\p{Cf}\p{Zl}\p{Zp}]/gu;

/** Kullanıcı metnini temizler: görünmez/kontrol karakterleri atar, boşlukları sadeleştirir, uzunluğu sınırlar. */
function cleanText(value, max) {
  const s = String(value == null ? '' : value).normalize('NFC').replace(CONTROL_RE, '').replace(/\s+/g, ' ').trim();
  const chars = Array.from(s);
  return chars.length > max ? chars.slice(0, max).join('').trim() : s;
}

/**
 * Karşılaştırma anahtarı: büyük/küçük harf, boşluk, noktalama ve Türkçe karakter farklarını yok sayar.
 * "İzmir" = "izmir" = " IZMIR " → "izmir"
 */
function foldKey(value) {
  return trLower(cleanText(value, 200))
    .normalize('NFD').replace(/\p{M}/gu, '')
    .replace(/ı/g, 'i')
    .replace(/[\s\-‐–—'’`´.,_()/\\"!?:;*+]+/g, '');
}

/** Cevabın ilk harfini Türkçe kurallarla büyük harfe çevirir. */
function firstLetter(value) {
  const s = cleanText(value, 200);
  if (!s) return '';
  return Array.from(trUpper(s))[0] || '';
}
const startsWithLetter = (value, letter) => !!letter && firstLetter(value) === letter;

/** Basit, deterministik metin özeti (veri imzası için). */
function hashString(str) {
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
    h2 = Math.imul(h2 + c, 2246822519) >>> 0;
  }
  return (h1.toString(36) + h2.toString(36)).slice(0, 14);
}

const CITY_KEYS = new Set([...TR_PROVINCES, ...TR_CITY_ALIASES, ...WORLD_CITIES].map(foldKey));
const COUNTRY_KEYS = new Set(COUNTRIES.map(foldKey));

/** Katılımda karşılaştırılan veri imzası: listeler, puanlar, alfabe, kategoriler. */
const DATA_SIGNATURE = hashString(JSON.stringify({
  p: CONFIG.PROTOCOL, a: ALPHABET, n: NEVER_LETTERS, s: SCORE,

/* =========================================================================
 * 4. OYUN MOTORU (saf fonksiyonlar – ağdan ve arayüzden bağımsız)
 * ========================================================================= */
const Engine = {
  /** Lobi ayarındaki harflerden oynanabilir havuzu üretir (Ğ asla yok). */
  letterPool(letters) {
    const set = new Set(Array.isArray(letters) ? letters : []);
    return PLAYABLE_LETTERS.filter(l => set.has(l));
  },

  /** Bu maçta henüz çıkmamış bir harf seçer. */
  pickLetter(pool, used, rnd = Math.random) {
    const avail = pool.filter(l => !used.includes(l));
    if (!avail.length) return null;
    return avail[Math.floor(rnd() * avail.length) % avail.length];
  },

  /** Dolu (boş olmayan) alan sayısı. */
  filledCount(cats, answers) {
    let n = 0;
    for (const c of cats) if (foldKey((answers && answers[c.id]) || '')) n++;
    return n;
  },

  /** STOP diyebilmek için tüm alanlar dolu ve doğru harfle başlıyor olmalı. */
  canStop(cats, answers, letter) {
    return cats.length > 0 && cats.every(c => {
      const v = (answers && answers[c.id]) || '';
      return foldKey(v) && startsWithLetter(v, letter);
    });
  },

  /**
   * Bir turu değerlendirir.
   * @param {object} o
   *  cats       – [{id,name,kind}]
   *  letter     – tur harfi
   *  pids       – puanlanacak oyuncular
   *  activePids – oy kullanabilecek (bağlı, ayrılmamış) oyuncular
   *  answers    – {pid:{catId:text}}
   *  votes      – {catId:{ownerPid:[voterPid]}}  ("geçersiz" oyları)
   *  overrides  – {catId:{ownerPid:'valid'|'invalid'}} (ev sahibinin son kararı)
   */
  evaluate(o) {
    const { cats, letter, pids } = o;
    const active = o.activePids || pids;
    const rows = {}, pts = {}, uniques = {}, catPts = {};
    for (const p of pids) { pts[p] = 0; uniques[p] = 0; catPts[p] = {}; }

    for (const c of cats) {
      const r = rows[c.id] = {};
      const list = c.kind === 'city' ? CITY_KEYS : c.kind === 'country' ? COUNTRY_KEYS : null;
      for (const p of pids) {
        const text = cleanText((o.answers && o.answers[p] && o.answers[p][c.id]) || '', CONFIG.ANSWER_MAX);
        const key = foldKey(text);
        const empty = !key;
        const letterOk = !empty && startsWithLetter(text, letter);
        const verified = letterOk && !!list && list.has(key);
        const voters = active.filter(v => v !== p);
        const votable = letterOk && !verified && voters.length > 0;
        const rawVotes = (o.votes && o.votes[c.id] && o.votes[c.id][p]) || [];
        const votes = votable ? rawVotes.filter(v => voters.includes(v)) : [];
        const ovRaw = o.overrides && o.overrides[c.id] && o.overrides[c.id][p];
        const override = !empty && (ovRaw === 'valid' || ovRaw === 'invalid') ? ovRaw : null;
        let valid = letterOk;
        if (votable && votes.length > voters.length / 2) valid = false;   // çoğunluk "geçersiz" dedi
        if (override === 'valid') valid = true;
        if (override === 'invalid') valid = false;
        r[p] = {
          text, key, empty, letterOk, verified,
          notInList: !!list && letterOk && !verified,
          votable, votes, voters: votable ? voters.length : 0,
          override, valid, dup: false, pts: 0,
        };
      }
      // Puanlama yalnızca geçerli cevaplar üzerinden yapılır.
      const validPids = pids.filter(p => r[p].valid);
      const counts = {};
      for (const p of validPids) counts[r[p].key] = (counts[r[p].key] || 0) + 1;
      for (const p of pids) {
        const cell = r[p];
        if (cell.valid) {
          if (validPids.length === 1) cell.pts = SCORE.SOLO;
          else if (counts[cell.key] > 1) { cell.pts = SCORE.SHARED; cell.dup = true; }
          else cell.pts = SCORE.UNIQUE;
        } else cell.pts = SCORE.NONE;
        pts[p] += cell.pts;
        catPts[p][c.id] = cell.pts;
        if (cell.pts >= SCORE.UNIQUE) uniques[p]++;
      }
    }
    return { rows, pts, uniques, catPts };
  },

  /** Puanlara göre sıralama (eşit puan aynı sırayı paylaşır: 1, 1, 3). */
  rank(pids, totals) {
    const list = pids.map(pid => ({ pid, total: totals[pid] || 0 }));
    list.sort((a, b) => b.total - a.total);
    let prev = null, rank = 0;
    list.forEach((it, i) => { if (it.total !== prev) { rank = i + 1; prev = it.total; } it.rank = rank; });
    return list;
  },

  /** Rastgele oda kodu. */
  makeCode(rnd = Math.random) {
    let s = '';
    for (let i = 0; i < CONFIG.CODE_LENGTH; i++) s += CONFIG.CODE_ALPHABET[Math.floor(rnd() * CONFIG.CODE_ALPHABET.length)];
    return s;
  },
  isValidCode(code) {
    return typeof code === 'string' && code.length === CONFIG.CODE_LENGTH && [...code].every(ch => CONFIG.CODE_ALPHABET.includes(ch));
  },
  normalizeCode(raw) {
    return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, CONFIG.CODE_LENGTH);
  },
};

const Time = {
  now: () => (typeof performance !== 'undefined' ? performance.now() : Date.now()),
  istanbulHour(d = new Date()) {
    try {
      const part = new Intl.DateTimeFormat('tr-TR', { timeZone: 'Europe/Istanbul', hour: '2-digit', hourCycle: 'h23' })
        .formatToParts(d).find(p => p.type === 'hour');
      const h = parseInt(part && part.value, 10);
      return Number.isFinite(h) ? h % 24 : d.getHours();
    } catch (e) { return d.getHours(); }
  },
  greeting(d = new Date()) {
    const h = Time.istanbulHour(d);
    if (h >= 5 && h < 12) return 'Günaydın';
    if (h >= 12 && h < 18) return 'İyi günler';
    if (h >= 18 && h < 23) return 'İyi akşamlar';
    return 'İyi geceler';
  },
  longDate(d = new Date()) {
    try {
      return new Intl.DateTimeFormat('tr-TR', { timeZone: 'Europe/Istanbul', day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' }).format(d);
    } catch (e) { return d.toLocaleDateString('tr-TR'); }
  },
  shortDate(ts) {
    try {
      return new Intl.DateTimeFormat('tr-TR', { timeZone: 'Europe/Istanbul', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(ts));
    } catch (e) { return new Date(ts).toLocaleString('tr-TR'); }
  },
};
